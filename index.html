<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魂斗罗</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; text-align: center; pointer-events: none; text-shadow: 2px 2px 0 #000; }
#startScreen, #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-family: 'Courier New', monospace; z-index: 10; }
#startScreen { background: #000; }
#gameOverScreen { background: rgba(0,0,0,0.85); display: none; }
#startScreen h1 { font-size: 64px; color: #e03030; text-shadow: 4px 4px 0 #600; margin-bottom: 20px; letter-spacing: 8px; }
#startScreen h2 { font-size: 20px; color: #aaa; margin-bottom: 40px; }
#startScreen .controls { font-size: 14px; color: #888; line-height: 2; margin-bottom: 30px; }
#startScreen .controls span { color: #ff0; }
#startScreen .blink { font-size: 20px; color: #fff; animation: blink 1s infinite; }
#gameOverScreen h1 { font-size: 48px; color: #e03030; margin-bottom: 20px; }
#gameOverScreen .score { font-size: 24px; color: #ff0; margin-bottom: 30px; }
#gameOverScreen .blink { font-size: 18px; color: #fff; animation: blink 1s infinite; }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.volume-controls { margin-bottom: 20px; }
.volume-controls label { display: inline-block; width: 80px; color: #aaa; font-size: 14px; text-align: right; margin-right: 10px; }
.volume-controls input[type="range"] { width: 120px; vertical-align: middle; accent-color: #e03030; }
.volume-controls .vol-val { display: inline-block; width: 36px; color: #ff0; font-size: 14px; text-align: left; }
.mode-select { display: flex; gap: 30px; margin-top: 20px; justify-content: center; }
.mode-btn { font-size: 20px; color: #fff; padding: 12px 30px; border: 2px solid #e03030; cursor: pointer; transition: all 0.2s; user-select: none; background: transparent; }
.mode-btn:hover { background: #e03030; color: #fff; }
#mpServerInput { background: rgba(255,255,255,0.1); border: 1px solid #666; color: #fff; font-size: 14px; padding: 6px 10px; width: 240px; text-align: center; margin-top: 10px; font-family: 'Courier New', monospace; }
#mobileControls { position: absolute; bottom: 10px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 20px; z-index: 5; }
#mobileControls button { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: #fff; font-size: 18px; padding: 15px 20px; border-radius: 10px; touch-action: manipulation; user-select: none; }
#dpad { display: flex; gap: 5px; }
#actionBtns { display: flex; gap: 10px; }
@media (max-width: 768px) { #mobileControls { display: flex; } }
#scoreboard { position: absolute; top: 10px; right: 20px; color: #fff; font-size: 16px; font-family: 'Courier New', monospace; z-index: 20; display: none; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div id="scoreboard">胜率：0/0</div>

<div id="waitingOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:'Courier New',monospace;z-index:15;background:rgba(0,0,0,0.6);pointer-events:none;">
<div style="font-size:36px;color:#f44;margin-bottom:20px;">你已阵亡</div>
<div class="blink" style="font-size:18px;">对方仍在游戏中，请耐心等候</div>
</div>

<div id="startScreen">
<h1>魂斗罗</h1>
<h2>CONTRA</h2>
<div class="controls">
<span>← →</span> 移动 &nbsp; <span>↑</span> 瞄准上 &nbsp; <span>↓</span> 趴下<br>
<span>K / SPACE</span> 跳跃 &nbsp; <span>X / J</span> 射击<br>
<span>P</span> 暂停
</div>
<div class="volume-controls">
<label>BGM 音量</label><input type="range" id="bgmSlider" min="0" max="100" value="50"><span class="vol-val" id="bgmVal">50</span><br>
<label>游戏音量</label><input type="range" id="sfxSlider" min="0" max="100" value="50"><span class="vol-val" id="sfxVal">50</span>
</div>
<div class="mode-select">
<div class="mode-btn" id="btnSingle">单人游戏</div>
<div class="mode-btn" id="btnBattle">双人对战</div>
</div>
<div id="mpStatus" style="display:none; margin-top:15px;">
<input id="mpServerInput" type="text" placeholder="服务器地址 (如 ws://1.2.3.4:8080)" style="display:none;">
<div id="mpStatusText" class="blink" style="font-size:18px; color:#0ff; margin-top:10px;"></div>
<div id="mpCountdown" style="font-size:48px; color:#ff0; margin-top:10px; display:none;"></div>
</div>
</div>

<div id="gameOverScreen">
<h1>GAME OVER</h1>
<div class="score">得分: <span id="finalScore">0</span></div>
<div class="blink">按 ENTER 重新开始</div>
</div>

<div id="battleResultScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:'Courier New',monospace;z-index:10;background:rgba(0,0,0,0.9);">
<h1 id="battleResultTitle" style="font-size:48px;margin-bottom:30px;"></h1>
<div id="battleResultDetails" style="font-size:18px;line-height:2;text-align:center;"></div>
<div id="battleResultVoteStatus" style="margin-top:20px;font-size:16px;color:#0ff;min-height:24px;"></div>
<div id="battleResultBtns" style="display:flex;gap:30px;margin-top:20px;">
<div class="mode-btn" id="btnRematch">再来一局</div>
<div class="mode-btn" id="btnEndBattle">结束对战</div>
</div>
</div>

<canvas id="game"></canvas>

<div id="mobileControls">
<div id="dpad">
<button id="btnLeft">◀</button>
<button id="btnRight">▶</button>
<button id="btnUp">▲</button>
<button id="btnDown">▼</button>
</div>
<div id="actionBtns">
<button id="btnJump">跳</button>
<button id="btnFire">射</button>
</div>
</div>

<script>
// ========== 游戏引擎 ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;
canvas.width = W;
canvas.height = H;

// 缩放画布以适应屏幕
function resizeCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ========== 音效系统 ==========
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// 音量控制
let bgmVolume = parseInt(localStorage.getItem('bgmVolume') ?? '50') / 100;
let sfxVolume = parseInt(localStorage.getItem('sfxVolume') ?? '50') / 100;
const sfxMasterGain = audioCtx.createGain();
sfxMasterGain.gain.value = sfxVolume;
sfxMasterGain.connect(audioCtx.destination);

// 初始化滑块
const bgmSlider = document.getElementById('bgmSlider');
const sfxSlider = document.getElementById('sfxSlider');
const bgmValEl = document.getElementById('bgmVal');
const sfxValEl = document.getElementById('sfxVal');
bgmSlider.value = Math.round(bgmVolume * 100);
sfxSlider.value = Math.round(sfxVolume * 100);
bgmValEl.textContent = bgmSlider.value;
sfxValEl.textContent = sfxSlider.value;

bgmSlider.addEventListener('input', () => {
    bgmVolume = bgmSlider.value / 100;
    bgmValEl.textContent = bgmSlider.value;
    localStorage.setItem('bgmVolume', bgmSlider.value);
    if (bgmGain) bgmGain.gain.value = bgmVolume;
});
sfxSlider.addEventListener('input', () => {
    sfxVolume = sfxSlider.value / 100;
    sfxValEl.textContent = sfxSlider.value;
    localStorage.setItem('sfxVolume', sfxSlider.value);
    sfxMasterGain.gain.value = sfxVolume;
});

function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(sfxMasterGain);
    const t = audioCtx.currentTime;

    switch(type) {
        case 'shoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            osc.start(t); osc.stop(t + 0.08);
            break;
        case 'spread':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.12);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.start(t); osc.stop(t + 0.12);
            break;
        case 'explosion':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(t); osc.stop(t + 0.3);
            break;
        case 'hit':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.start(t); osc.stop(t + 0.15);
            break;
        case 'die':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
            osc.start(t); osc.stop(t + 0.5);
            break;
        case 'powerup':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, t);
            osc.frequency.exponentialRampToValueAtTime(1200, t + 0.2);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.start(t); osc.stop(t + 0.25);
            break;
        case 'rapid':
            osc.type = 'square';
            osc.frequency.setValueAtTime(1000, t);
            osc.frequency.exponentialRampToValueAtTime(400, t + 0.05);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.start(t); osc.stop(t + 0.05);
            break;
        case 'spiral':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(1500, t + 0.15);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.25);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.start(t); osc.stop(t + 0.25);
            break;
        case 'lightning': {
            // 闪电音效：多个快速噪声脉冲模拟电弧
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2000, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.start(t); osc.stop(t + 0.15);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(sfxMasterGain);
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(3000, t);
            osc2.frequency.exponentialRampToValueAtTime(500, t + 0.1);
            gain2.gain.setValueAtTime(0.15, t + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc2.start(t + 0.02); osc2.stop(t + 0.12);
            break;
        }
        case 'homing':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
            break;
        case 'leap':
            // 跃起音效：低频上扬
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, t);
            osc.frequency.exponentialRampToValueAtTime(400, t + 0.3);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.start(t); osc.stop(t + 0.4);
            break;
        case 'splash':
            // 落水音效：噪声+低频下落
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.25);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(t); osc.stop(t + 0.3);
            const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
            const noiseData = noiseBuf.getChannelData(0);
            for (let ni = 0; ni < noiseData.length; ni++) noiseData[ni] = Math.random() * 2 - 1;
            const noiseSrc = audioCtx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            const noiseG = audioCtx.createGain();
            noiseG.gain.setValueAtTime(0.15, t);
            noiseG.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            const noiseF = audioCtx.createBiquadFilter();
            noiseF.type = 'lowpass';
            noiseF.frequency.value = 2000;
            noiseSrc.connect(noiseF);
            noiseF.connect(noiseG);
            noiseG.connect(sfxMasterGain);
            noiseSrc.start(t); noiseSrc.stop(t + 0.15);
            break;
        case 'wbHit':
            // Boss受击音效：金属碰撞
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(150, t + 0.12);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.start(t); osc.stop(t + 0.12);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(sfxMasterGain);
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1200, t);
            osc2.frequency.exponentialRampToValueAtTime(300, t + 0.08);
            gain2.gain.setValueAtTime(0.15, t + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc2.start(t + 0.02); osc2.stop(t + 0.1);
            break;
    }
}

// ========== BGM 系统 ==========
let bgmPlaying = false;
let bgmGain = null;
let bgmInterval = null;

// 音符频率表
const NOTE_FREQ = {
    'C2':65.41,'D2':73.42,'E2':82.41,'F2':87.31,'G2':98,'A2':110,'B2':123.47,
    'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,
    'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'B4':493.88,
    'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880,'B5':987.77,
    'Eb3':155.56,'Bb3':233.08,'Ab3':207.65,'Db3':138.59,'Gb3':185,'Eb4':311.13,
    'Bb4':466.16,'Ab4':415.30,'Db4':277.18,'Gb4':369.99,'Eb5':622.25,'Bb5':932.33,
};

function startBGM() {
    if (bgmPlaying) return;
    bgmPlaying = true;

    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = bgmVolume;
    bgmGain.connect(audioCtx.destination);

    // 魂斗罗风格电子BGM - 经典8bit旋律
    const bassLine = [
        'E2','E2','E2','G2','A2','A2','G2','E2',
        'D2','D2','D2','F2','G2','G2','F2','D2',
        'C2','C2','C2','E2','G2','G2','E2','C2',
        'D2','D2','E2','F2','G2','G2','A2','B2',
    ];

    const melody = [
        'E4','E4','G4','A4','G4','E4','D4','C4',
        'D4','D4','F4','G4','F4','D4','C4','B3',
        'C4','C4','E4','G4','E4','C4','B3','A3',
        'B3','C4','D4','E4','G4','A4','B4','C5',
    ];

    const chords = [
        'E3','E3','G3','A3','G3','E3','D3','C3',
        'D3','D3','F3','G3','F3','D3','C3','B2',
        'C3','C3','E3','G3','E3','C3','B2','A2',
        'B2','C3','D3','E3','G3','A3','B3','C4',
    ];

    let step = 0;
    const bpm = 160;
    const stepTime = 60 / bpm / 2;

    function playStep() {
        if (!bgmPlaying) return;
        const t = audioCtx.currentTime;
        const idx = step % bassLine.length;

        // 贝斯线 - 方波
        const bassOsc = audioCtx.createOscillator();
        const bassG = audioCtx.createGain();
        bassOsc.type = 'square';
        bassOsc.frequency.value = NOTE_FREQ[bassLine[idx]] || 130;
        bassG.gain.setValueAtTime(0.2, t);
        bassG.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 0.9);
        bassOsc.connect(bassG);
        bassG.connect(bgmGain);
        bassOsc.start(t);
        bassOsc.stop(t + stepTime * 0.9);

        // 和弦垫音 - 锯齿波
        const padOsc = audioCtx.createOscillator();
        const padG = audioCtx.createGain();
        padOsc.type = 'sawtooth';
        padOsc.frequency.value = NOTE_FREQ[chords[idx]] || 196;
        padG.gain.setValueAtTime(0.06, t);
        padG.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 1.8);
        padOsc.connect(padG);
        padG.connect(bgmGain);
        padOsc.start(t);
        padOsc.stop(t + stepTime * 1.8);

        // 旋律 - 正弦波（更干净的音色）
        if (step % 2 === 0) {
            const melOsc = audioCtx.createOscillator();
            const melG = audioCtx.createGain();
            melOsc.type = 'sine';
            melOsc.frequency.value = NOTE_FREQ[melody[idx]] || 330;
            melG.gain.setValueAtTime(0.15, t);
            melG.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 1.5);
            melOsc.connect(melG);
            melG.connect(bgmGain);
            melOsc.start(t);
            melOsc.stop(t + stepTime * 1.5);
        }

        // 鼓点 - 噪声模拟kick和hihat
        if (step % 4 === 0) {
            // Kick
            const kickOsc = audioCtx.createOscillator();
            const kickG = audioCtx.createGain();
            kickOsc.type = 'sine';
            kickOsc.frequency.setValueAtTime(150, t);
            kickOsc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
            kickG.gain.setValueAtTime(0.35, t);
            kickG.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            kickOsc.connect(kickG);
            kickG.connect(bgmGain);
            kickOsc.start(t);
            kickOsc.stop(t + 0.15);
        }
        if (step % 2 === 1) {
            // Hihat (噪声)
            const bufSize = audioCtx.sampleRate * 0.05;
            const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buf;
            const hiG = audioCtx.createGain();
            const hiFilter = audioCtx.createBiquadFilter();
            hiFilter.type = 'highpass';
            hiFilter.frequency.value = 8000;
            hiG.gain.setValueAtTime(0.15, t);
            hiG.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            noise.connect(hiFilter);
            hiFilter.connect(hiG);
            hiG.connect(bgmGain);
            noise.start(t);
            noise.stop(t + 0.05);
        }

        step++;
    }

    bgmInterval = setInterval(playStep, stepTime * 1000);
}

function stopBGM() {
    bgmPlaying = false;
    if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    if (bgmGain) { bgmGain.disconnect(); bgmGain = null; }
}

// ========== 输入系统 ==========
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// 秘籍检测：连续输入 yff 切换简单模式（双人模式禁用）
document.addEventListener('keydown', e => {
    if (multiplayerMode) return;
    cheatBuffer.push(e.key.toLowerCase());
    if (cheatBuffer.length > 10) cheatBuffer.shift();
    const seq = cheatBuffer.join('');
    if (seq.includes('yff')) {
        cheatBuffer = []; // 清空缓冲区防止重复触发
        if (!easyMode) {
            easyMode = true;
            lives = 30;
            screenShake = 15;
            spawnParticles(player.x + player.w/2, player.y + player.h/2, 30, '#0ff', 6);
        } else {
            easyMode = false;
            screenShake = 10;
            spawnParticles(player.x + player.w/2, player.y + player.h/2, 20, '#f80', 4);
        }
    }
});

// ========== 多人对战 WebSocket ==========
function getServerUrl() {
    const input = document.getElementById('mpServerInput');
    const val = input.value.trim();
    if (val) return val;
    // 默认连接当前页面同源
    const loc = window.location;
    if (loc.protocol === 'file:') return 'ws://localhost:3000';
    const wsProtocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = loc.port ? `${loc.hostname}:${loc.port}` : loc.hostname;
    return `${wsProtocol}//${host}`;
}

function showShareUrl(url) {
    const statusDiv = document.getElementById('mpStatusText');
    statusDiv.innerHTML =
        '<div style="font-size:14px;color:#aaa;margin-bottom:6px;">分享此地址给对手：</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;gap:8px;">' +
        '<input id="publicUrlInput" type="text" value="' + url + '" readonly ' +
        'style="background:rgba(255,255,255,0.1);border:1px solid #0ff;color:#0ff;font-size:16px;padding:6px 10px;width:260px;text-align:center;font-family:monospace;cursor:pointer;" ' +
        'onclick="this.select()">' +
        '<button id="copyUrlBtn" ' +
        'style="background:#e03030;border:none;color:#fff;padding:6px 14px;cursor:pointer;font-size:14px;">复制</button>' +
        '</div>';
    document.getElementById('copyUrlBtn').addEventListener('click', () => {
        const input = document.getElementById('publicUrlInput');
        input.select();
        navigator.clipboard.writeText(input.value).then(() => {
            document.getElementById('copyUrlBtn').textContent = '已复制';
            setTimeout(() => { document.getElementById('copyUrlBtn').textContent = '复制'; }, 1500);
        });
    });
}

function fetchPublicUrl() {
    const baseUrl = getServerUrl().replace(/^ws/, 'http').replace(/\/$/, '');
    fetch(baseUrl + '/api/url')
        .then(r => r.json())
        .then(data => {
            if (data.url) {
                showShareUrl(data.url);
            } else {
                showShareUrl(window.location.href);
            }
        })
        .catch(() => {
            showShareUrl(window.location.href);
        });
}

function connectBattleServer() {
    const url = getServerUrl();
    document.getElementById('mpStatus').style.display = 'block';
    document.getElementById('mpStatusText').textContent = '正在连接服务器...';

    // 获取公网地址并显示
    fetchPublicUrl();

    try {
        ws = new WebSocket(url);
    } catch (e) {
        document.getElementById('mpStatusText').textContent = '无法连接服务器';
        return;
    }

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join' }));
        battleState = 'waiting';
        document.getElementById('mpStatusText').textContent = '正在匹配对手...';
    };

    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleBattleMessage(msg);
    };

    ws.onclose = () => {
        if (battleState === 'waiting' || battleState === 'matched') {
            resetBattleState();
            document.getElementById('mpStatusText').textContent = '连接断开';
            setTimeout(() => {
                document.getElementById('mpStatus').style.display = 'none';
            }, 2000);
        }
    };

    ws.onerror = () => {
        document.getElementById('mpStatusText').textContent = '无法连接服务器，请检查地址';
        setTimeout(() => resetBattleState(), 2000);
    };
}

function handleBattleMessage(msg) {
    switch (msg.type) {
        case 'waiting':
            document.getElementById('mpStatusText').textContent = '正在匹配对手...';
            break;

        case 'matched':
            battleState = 'matched';
            document.getElementById('mpStatusText').textContent = '已匹配！等待双方就绪...';
            // 自动向服务器确认就绪
            ws.send(JSON.stringify({ type: 'ready' }));
            break;

        case 'opponent_ready':
            document.getElementById('mpStatusText').textContent = '对手已就绪，等待你确认...';
            break;

        case 'countdown':
            battleState = 'countdown';
            document.getElementById('mpCountdown').style.display = 'block';
            document.getElementById('mpCountdown').textContent = msg.count;
            document.getElementById('mpStatusText').textContent = '对战即将开始';
            break;

        case 'start':
            battleState = 'playing';
            multiplayerMode = true;
            state = 'playing';
            initGame();
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('mpCountdown').style.display = 'none';
            document.getElementById('mpStatus').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'block';
            startBGM();
            break;

        case 'opponent_result':
            opponentResult = msg;
            break;

        case 'battle_result':
            battleResult = msg;
            showBattleResult(msg);
            break;

        case 'opponent_rematch':
            document.getElementById('battleResultVoteStatus').textContent = '对手想再来一局！';
            break;

        case 'opponent_end':
            document.getElementById('battleResultVoteStatus').textContent = '对手结束了对战';
            setTimeout(() => {
                resetBattleState();
                document.getElementById('battleResultScreen').style.display = 'none';
                state = 'start';
                document.getElementById('startScreen').style.display = 'flex';
                stopBGM();
            }, 1500);
            break;

        case 'restart':
            document.getElementById('battleResultScreen').style.display = 'none';
            document.getElementById('mpStatus').style.display = 'block';
            document.getElementById('mpStatusText').textContent = '对手已就绪，准备再来一局！';
            document.getElementById('mpCountdown').style.display = 'none';
            battleState = 'matched';
            opponentResult = null;
            battleResult = null;
            ws.send(JSON.stringify({ type: 'ready' }));
            break;

        case 'score_update':
            document.getElementById('scoreboard').textContent = '胜率：' + msg.myWins + '/' + msg.totalGames;
            break;
    }
}

function sendBattleResult(outcome) {
    if (!ws || ws.readyState !== WebSocket.OPEN || battleState !== 'playing') return;
    battleState = 'finished';
    ws.send(JSON.stringify({
        type: 'result',
        outcome: outcome,
        score: score,
        frames: frameCount
    }));
}

function showBattleResult(result) {
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('waitingOverlay').style.display = 'none';

    const title = document.getElementById('battleResultTitle');
    const details = document.getElementById('battleResultDetails');

    if (result.winner === 'draw') {
        title.textContent = '平局!';
        title.style.color = '#ff0';
    } else if (result.winner === 'self') {
        title.textContent = '你赢了!';
        title.style.color = '#0f0';
    } else {
        title.textContent = '你输了!';
        title.style.color = '#f44';
    }

    const selfData = result.self;
    const oppData = result.opponent;

    const formatTime = (frames) => (frames / 60).toFixed(1) + 's';
    const formatOutcome = (oc) => oc === 'victory' ? '通关' : oc === 'disconnect' ? '断线' : '失败';

    details.innerHTML =
        '<div style="display:flex;gap:60px;">' +
        '<div>' +
        '<div style="color:#0ff;font-size:24px;">你</div>' +
        '<div>结果: ' + formatOutcome(selfData.outcome) + '</div>' +
        '<div>得分: ' + selfData.score + '</div>' +
        '<div>用时: ' + (selfData.outcome === 'victory' ? formatTime(selfData.frames) : '-') + '</div>' +
        '</div>' +
        '<div>' +
        '<div style="color:#f80;font-size:24px;">对手</div>' +
        '<div>结果: ' + formatOutcome(oppData.outcome) + '</div>' +
        '<div>得分: ' + oppData.score + '</div>' +
        '<div>用时: ' + (oppData.outcome === 'victory' ? formatTime(oppData.frames) : '-') + '</div>' +
        '</div>' +
        '</div>';

    state = 'battleresult';
    document.getElementById('battleResultScreen').style.display = 'flex';
    document.getElementById('battleResultVoteStatus').textContent = '';
    document.getElementById('battleResultBtns').style.display = 'flex';

    document.getElementById('btnRematch').onclick = () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'rematch' }));
            document.getElementById('battleResultVoteStatus').textContent = '你选择了再来一局，等待对手选择...';
            document.getElementById('battleResultBtns').style.display = 'none';
        }
    };
    document.getElementById('btnEndBattle').onclick = () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'end' }));
        }
        resetBattleState();
        document.getElementById('battleResultScreen').style.display = 'none';
        state = 'start';
        document.getElementById('startScreen').style.display = 'flex';
        stopBGM();
    };
}

function resetBattleState() {
    multiplayerMode = false;
    battleState = 'idle';
    opponentResult = null;
    battleResult = null;
    document.getElementById('scoreboard').style.display = 'none';
    document.getElementById('waitingOverlay').style.display = 'none';
    if (ws) { ws.close(); ws = null; }
}

// 移动端控制
const touchState = { left: false, right: false, up: false, down: false, jump: false, fire: false };

function setupMobileBtn(id, key) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', e => { e.preventDefault(); touchState[key] = true; });
    btn.addEventListener('touchend', e => { e.preventDefault(); touchState[key] = false; });
    btn.addEventListener('touchcancel', e => { touchState[key] = false; });
}
setupMobileBtn('btnLeft', 'left');
setupMobileBtn('btnRight', 'right');
setupMobileBtn('btnUp', 'up');
setupMobileBtn('btnDown', 'down');
setupMobileBtn('btnJump', 'jump');
setupMobileBtn('btnFire', 'fire');

function isKeyDown(action) {
    switch(action) {
        case 'left': return keys['ArrowLeft'] || keys['KeyA'] || touchState.left;
        case 'right': return keys['ArrowRight'] || keys['KeyD'] || touchState.right;
        case 'up': return keys['ArrowUp'] || keys['KeyW'] || touchState.up;
        case 'down': return keys['ArrowDown'] || keys['KeyS'] || touchState.down;
        case 'jump': return keys['KeyK'] || keys['Space'] || touchState.jump;
        case 'fire': return keys['KeyX'] || keys['KeyJ'] || touchState.fire;
    }
    return false;
}

// ========== 关卡数据 ==========
const TILE = 32;
const LEVEL_WIDTH = 230; // 关卡宽度（格数）

// 地形类型: 0=空气, 1=地面, 2=平台, 3=水, 4=桥
function generateLevel() {
    const map = [];
    for (let y = 0; y < H / TILE; y++) {
        map[y] = [];
        for (let x = 0; x < LEVEL_WIDTH; x++) {
            map[y][x] = 0;
        }
    }
    const groundY = Math.floor(H / TILE) - 2;

    // 基础地面
    for (let x = 0; x < LEVEL_WIDTH; x++) {
        map[groundY][x] = 1;
        map[groundY + 1][x] = 1;
    }

    // 地形起伏 - 最多抬高1格，确保能跳上去（水路段x=105~158不放地形）
    const terrain = [
        { x: 15, w: 4, h: -1 },
        { x: 25, w: 6, h: -1 },
        { x: 38, w: 3, h: -1 },
        { x: 55, w: 5, h: -1 },
        { x: 70, w: 4, h: -1 },
        { x: 88, w: 6, h: -1 },
        { x: 161, w: 6, h: -1 },
        { x: 178, w: 4, h: -1 },
        { x: 190, w: 8, h: -1 },
        { x: 208, w: 5, h: -1 },
        { x: 220, w: 6, h: -1 },
    ];

    terrain.forEach(t => {
        for (let x = t.x; x < t.x + t.w; x++) {
            for (let dy = 0; dy >= t.h; dy--) {
                if (groundY + dy >= 0 && groundY + dy < map.length) {
                    map[groundY + dy][x] = 1;
                }
            }
        }
    });

    // 悬浮平台 - 最高3格，确保跳跃可及
    // 移动平台区域附近不放静态平台
    const platforms = [
        { x: 8, y: groundY - 3, w: 4 },
        { x: 20, y: groundY - 3, w: 3 },
        { x: 42, y: groundY - 3, w: 3 },
        { x: 50, y: groundY - 3, w: 4 },
        { x: 62, y: groundY - 3, w: 3 },
        { x: 78, y: groundY - 4, w: 3 },
        { x: 92, y: groundY - 3, w: 4 },
        { x: 163, y: groundY - 3, w: 3 },
        { x: 171, y: groundY - 3, w: 4 },
        { x: 192, y: groundY - 4, w: 3 },
        { x: 210, y: groundY - 3, w: 4 },
        { x: 213, y: groundY - 4, w: 3 },
        { x: 220, y: groundY - 3, w: 3 },
    ];

    platforms.forEach(p => {
        for (let x = p.x; x < p.x + p.w; x++) {
            if (p.y >= 0 && p.y < map.length) {
                map[p.y][x] = 2;
            }
        }
    });

    // 水域 - 一段长水路（约50格，约5个屏幕宽）
    for (let x = 105; x < 158; x++) {
        map[groundY][x] = 3;
        map[groundY + 1][x] = 3;
    }
    // 水路两端抬高地形（比水面高1格的岸边）
    for (let x = 102; x < 105; x++) {
        map[groundY - 1][x] = 1;
    }
    for (let x = 158; x < 161; x++) {
        map[groundY - 1][x] = 1;
    }

    // 移动平台下方挖空地面，形成断层
    const platformPits = [
        { baseX: 33, range: 3, w: 3 },
        { baseX: 182, range: 4, w: 3 },
        { baseX: 202, range: 3, w: 4 },
    ];
    platformPits.forEach(p => {
        const minX = p.baseX - p.range - 1;
        const maxX = p.baseX + p.range + p.w;
        for (let x = minX; x <= maxX; x++) {
            if (x >= 0 && x < LEVEL_WIDTH) {
                // 不清除水域格子
                if (map[groundY][x] !== 3) {
                    map[groundY][x] = 0;
                    map[groundY + 1][x] = 0;
                }
            }
        }
    });

    return map;
}

// ========== 敌人生成配置 ==========
// 定点炮台配置（不会被动态生成）
const turretSpawns = [
    [35, -1], [115, -1],
    [130, -1], [150, -1], [166, -1], [186, -1],
];

function generateEnemies() {
    const enemies = [];
    const groundY = Math.floor(H / TILE) - 2;

    // 只生成定点炮台
    turretSpawns.forEach(([x, yOff]) => {
        const spawnY = (groundY + yOff) * TILE - TILE;
        enemies.push({
            type: 'turret',
            x: x * TILE,
            y: spawnY,
            w: TILE,
            h: TILE,
            alive: true,
            hp: 3,
            dir: -1,
            vx: 0,
            vy: 0,
            onGround: true,
            fireTimer: Math.random() * 120 + 60,
            active: false,
            animFrame: 0,
            animTimer: 0,
        });
    });

    // 树冠敌人（隐藏在水路段的树冠中，密度减半）
    const treeEnemySpots = [110, 120, 132, 144, 156];
    const waterGroundY = Math.floor(H / TILE) - 2;
    treeEnemySpots.forEach(tx => {
        const seed = tx * 31;
        const treeH = 400 + (seed % 80); // 与绘制一致：400~480px
        const actualCanopyY = waterGroundY * TILE - treeH;
        // 敌人位置 = 树冠探出身体的位置（与绘制对齐）
        const enemyX = tx * TILE + 16 - 12; // 居中于树干
        const enemyY = actualCanopyY + 20; // 探出时头部位置
        enemies.push({
            type: 'soldier',
            x: enemyX,
            y: enemyY,
            w: 24,
            h: 24, // 探出部分的高度
            alive: true,
            hp: 1,
            maxHp: 1,
            dir: -1,
            vx: 0,
            vy: 0,
            onGround: true,
            fireTimer: 90 + Math.random() * 200,
            active: true,
            animFrame: 0,
            animTimer: 0,
            inTree: true,
            treeTileX: tx,
            treeH: treeH,
            peeking: false,
            peekTimer: 120 + Math.random() * 250,
            peekDuration: 0,
        });
    });

    return enemies;
}

// 动态敌人生成系统
let dynamicSpawnTimer = 0;
const SPAWN_INTERVAL_MIN = 120; // 最小生成间隔（帧）
const SPAWN_INTERVAL_MAX = 240; // 最大生成间隔（帧）

function findGroundY(tileX) {
    // 从上往下找第一个实心地面的y坐标
    for (let ty = 0; ty < level.length; ty++) {
        if (isSolid(level[ty][tileX])) {
            return ty;
        }
    }
    return null;
}

function isSpawnPositionClear(x, y, w, h) {
    // 检查生成位置是否与墙壁重叠
    const left = Math.floor(x / TILE);
    const right = Math.floor((x + w - 1) / TILE);
    const top = Math.floor(y / TILE);
    const bottom = Math.floor((y + h - 1) / TILE);

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            if (ty >= 0 && ty < level.length && tx >= 0 && tx < level[0].length) {
                if (isSolid(level[ty][tx])) {
                    return false;
                }
            }
        }
    }
    return true;
}

function createDynamicEnemy(type, x) {
    const groundTileY = findGroundY(Math.floor(x / TILE));
    if (groundTileY === null) return null;

    // 根据类型确定尺寸和血量
    let ew = 24, eh = 36, hp = 1;
    if (type === 'heavy') { ew = 32; eh = 48; hp = 4; }
    else if (type === 'flamer') { ew = 28; eh = 38; hp = 2; }
    else if (type === 'lightning') { ew = 26; eh = 36; hp = 2; }

    const spawnY = groundTileY * TILE - eh;

    // 检查生成位置是否在墙内
    if (!isSpawnPositionClear(x, spawnY, ew, eh)) {
        return null;
    }

    return {
        type: type,
        x: x,
        y: spawnY,
        w: ew,
        h: eh,
        alive: true,
        hp: hp,
        maxHp: hp,
        dir: -1,
        vx: 0,
        vy: 0,
        onGround: true,
        fireTimer: Math.random() * 120 + 60,
        active: true, // 动态生成的敌人直接激活
        animFrame: 0,
        animTimer: 0,
        inWater: false,
    };
}

function createAirborneEnemy(x) {
    // 空降兵从屏幕顶部降落，约2.5秒落地
    return {
        type: 'paratrooper',
        x: x,
        y: -40,
        w: 24,
        h: 36,
        alive: true,
        hp: 2,
        maxHp: 2,
        dir: -1,
        vx: 0,
        vy: 0.05, // 非常缓慢下落
        onGround: false,
        fireTimer: Math.random() * 120 + 60,
        active: true,
        animFrame: 0,
        animTimer: 0,
        parachuting: true, // 降落伞状态
        driftSpeed: 0.8, // 水平飘移速度
    };
}

// 空降兵慢速子弹
function paratrooperFire(e) {
    const speed = 1.5; // 慢速子弹
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    enemyBullets.push({
        x: e.x + e.w / 2,
        y: e.y + e.h / 2,
        vx: dx * speed,
        vy: dy * speed,
        w: 6, h: 6,
        type: 'slow',
    });
}

function updateDynamicSpawn() {
    if (bossTriggered) return; // Boss战开始后停止生成敌人
    dynamicSpawnTimer--;
    if (dynamicSpawnTimer > 0) return;

    // 重置计时器
    dynamicSpawnTimer = SPAWN_INTERVAL_MIN + Math.random() * (SPAWN_INTERVAL_MAX - SPAWN_INTERVAL_MIN);

    // 随机生成1-2个敌人
    const count = Math.random() < 0.5 ? 1 : 2;
    const rand = Math.random();
    const paraChance = (waterBoss && waterBoss.alive) ? 0.05 : 0.2; // Boss存活时伞兵概率降低

    for (let i = 0; i < count; i++) {
        if (rand < paraChance) {
            // 空降兵
            const spawnX = camera.x + 50 + Math.random() * (W - 100);
            const enemy = createAirborneEnemy(spawnX);
            enemies.push(enemy);
        } else if (rand < 0.35) {
            // 15% 从左边生成
            const spawnX = camera.x - 50 - Math.random() * 50;
            const type = Math.random() < 0.3 ? 'flamer' : 'soldier';
            const enemy = createDynamicEnemy(type, spawnX);
            if (enemy) {
                enemy.dir = 1; // 向右移动
                enemies.push(enemy);
            }
        } else {
            // 65% 从右边生成
            const spawnX = camera.x + W + 50 + Math.random() * 100;
            const typeRoll = Math.random();
            let type = 'soldier';
            if (typeRoll < 0.3) type = 'runner';
            else if (typeRoll < 0.45) type = 'flamer';
            else if (typeRoll < 0.55) type = 'heavy';
            else if (typeRoll < 0.65) type = 'lightning';

            const enemy = createDynamicEnemy(type, spawnX);
            if (enemy) {
                enemies.push(enemy);
            }
        }
    }
}

// ========== Boss ==========
function createBoss(x, y) {
    return {
        x: x, y: y - TILE * 2,
        w: TILE * 3, h: TILE * 3,
        hp: 30, maxHp: 30,
        alive: true,
        phase: 0,
        fireTimer: 0,
        moveTimer: 0,
        dir: -1,
        vx: 0,
        eyeOpen: 0,
        animTimer: 0,
    };
}

// ========== 水路Boss：机械飞鱼 ==========
const WATER_CENTER_X = ((105 + 158) / 2) * TILE; // 4208
const WATER_SURFACE_Y = (Math.floor(H / TILE) - 2) * TILE; // 352
const WATER_LEFT = 105 * TILE;   // 3360
const WATER_RIGHT = 158 * TILE;  // 5056

function createWaterBoss(camX) {
    const startX = camX + W - 150; // 屏幕右侧出现
    return {
        x: startX, y: WATER_SURFACE_Y + 200, // 水面下方深处
        w: 90, h: 50,
        hp: 140, maxHp: 140,
        alive: true,
        phase: 'enter', // enter -> wait -> leap_rtl -> wait -> leap_ltr -> wait (循环)
        enterTimer: 0,
        animTimer: 0,
        fireTimer: 0,
        waitTimer: 0,
        leapTimer: 0,
        rotation: 0,
        vy: 0,
        vx: 0,
        facing: -1, // -1=左, 1=右
        jumpsAtPos: 0, // 当前位置跳跃次数
    };
}

function updateWaterBoss() {
    if (!waterBoss || !waterBoss.alive) return;
    const wb = waterBoss;
    wb.animTimer++;

    // 跳跃参数（2.5秒空中时间）
    const leapGravity = 0.09;
    const peakHeight = 400;
    const screenCenter = cameraLockX + W / 2;

    if (wb.phase === 'enter') {
        wb.enterTimer++;
        if (wb.enterTimer < 120) {
            const slowRise = (wb.enterTimer / 120) * 80;
            wb.y = WATER_SURFACE_Y + 200 - slowRise;
            if (wb.enterTimer % 10 === 0) {
                spawnParticles(wb.x + wb.w / 2 + (Math.random() - 0.5) * 50, WATER_SURFACE_Y + 10, 1, '#3af', 1);
            }
        } else if (wb.enterTimer < 240) {
            const riseProgress = (wb.enterTimer - 120) / 120;
            wb.y = WATER_SURFACE_Y + 120 - riseProgress * 128;
            if (wb.animTimer % 4 === 0) {
                spawnParticles(wb.x + wb.w / 2 + (Math.random() - 0.5) * 60, WATER_SURFACE_Y + 3, 2, '#4af', 2);
            }
        } else {
            wb.y = WATER_SURFACE_Y - 8;
            wb.phase = 'wait';
            wb.waitTimer = 0;
            wb.facing = (player.x + player.w / 2 < wb.x + wb.w / 2) ? -1 : 1;
        }
    } else if (wb.phase === 'wait') {
        // 水面等待6秒，面向玩家
        wb.facing = (player.x + player.w / 2 < wb.x + wb.w / 2) ? -1 : 1;
        wb.waitTimer++;
        if (wb.waitTimer % 30 === 0) {
            spawnParticles(wb.x + wb.w / 2 + (Math.random() - 0.5) * 40, WATER_SURFACE_Y + 3, 2, '#4af', 1);
        }
        // 发射鱼雷（第2次落水不发，改为冲到对面）
        if (wb.jumpsAtPos < 2 && wb.waitTimer >= 60 && wb.waitTimer % 120 === 60) {
            const torpedoX = wb.x + wb.w / 2;
            const torpedoY = WATER_SURFACE_Y + 10;
            const dir = (player.x + player.w / 2 < torpedoX) ? -1 : 1;
            enemyBullets.push({
                x: torpedoX, y: torpedoY,
                vx: dir * 2.5, vy: 0,
                w: 20, h: 8,
                type: 'torpedo',
                life: 600,
            });
            spawnParticles(torpedoX, torpedoY, 3, '#4af', 2);
        }
        if (wb.waitTimer >= 360) {
            if (wb.jumpsAtPos < 2) {
                // 原地起跳
                wb.leapStartX = wb.x;
                wb.phase = 'leap';
                wb.leapTimer = 0;
                wb.vx = 0;
                wb.vy = -Math.sqrt(2 * leapGravity * peakHeight);
                wb.fireTimer = 15;
                playSound('leap');
                spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 20, '#4af', 5);
                spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 10, '#fff', 4);
                screenShake = 5;
            } else {
                // 两次跳完，冲到对面
                const rightX = cameraLockX + W - 150;
                const leftX = cameraLockX + 150 - wb.w;
                wb.swimTargetX = (wb.x > screenCenter) ? leftX : rightX;
                wb.phase = 'swim';
                wb.swimTimer = 0;
                wb.swimStartX = wb.x;
                wb.facing = (wb.swimTargetX < wb.x) ? -1 : 1;
                playSound('splash');
                spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 15, '#4af', 3);
                screenShake = 4;
            }
        }
    } else if (wb.phase === 'leap') {
        wb.leapTimer++;
        wb.vy += leapGravity;
        wb.y += wb.vy;
        wb.rotation = wb.vy * 0.015;

        // 空中射击（起跳0.5秒后、落水0.5秒前，每次4发）
        const noFireStart = 30;
        const noFireEnd = 120;
        if (wb.leapTimer > noFireStart && wb.leapTimer < noFireEnd) {
            wb.fireTimer--;
            if (wb.fireTimer <= 0) {
                wb.fireTimer = 25;
                const bulletSpeed = 3;
                let dx = player.x + player.w / 2 - wb.x - wb.w / 2;
                let dy = player.y + player.h / 2 - wb.y - wb.h / 2;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d > 10) {
                    dx /= d; dy /= d;
                    for (const side of [-1, 1]) {
                        const finTipX = wb.x + wb.w / 2 + Math.cos(wb.rotation) * 35 * side;
                        const finTipY = wb.y - 5 + Math.sin(wb.rotation) * 10 * side;
                        enemyBullets.push({
                            x: finTipX, y: finTipY,
                            vx: dx * bulletSpeed, vy: dy * bulletSpeed,
                            w: 8, h: 8, special: true, type: 'heavy',
                        });
                        enemyBullets.push({
                            x: finTipX, y: finTipY,
                            vx: dx * bulletSpeed * 0.9, vy: dy * bulletSpeed + 0.5,
                            w: 8, h: 8, special: true, type: 'heavy',
                        });
                    }
                }
            }
        }

        // 撞击伞兵（回血）
        for (const e of enemies) {
            if (!e.alive || !e.active) continue;
            if (e.type === 'paratrooper' && rectCollide(wb, e)) {
                e.alive = false;
                wb.hp = Math.min(wb.hp + 2, wb.maxHp);
                spawnParticles(e.x + e.w / 2, e.y + e.h / 2, 8, '#f80', 3);
                screenShake = 3;
            }
        }

        // 落水检测（回到起跳位置）
        if (wb.y >= WATER_SURFACE_Y - 8) {
            wb.x = wb.leapStartX;
            wb.y = WATER_SURFACE_Y - 8;
            wb.vy = 0;
            wb.vx = 0;
            wb.rotation = 0;
            wb.jumpsAtPos++;
            wb.phase = 'wait';
            wb.waitTimer = 0;
            wb.facing = (player.x + player.w / 2 < wb.x + wb.w / 2) ? -1 : 1;
            playSound('splash');
            spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 20, '#4af', 5);
            spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 10, '#fff', 4);
            screenShake = 6;
        }
    } else if (wb.phase === 'swim') {
        // 水下冲刺到对面
        wb.swimTimer++;
        const swimDuration = 60; // 1秒冲到对面
        const t = Math.min(wb.swimTimer / swimDuration, 1);
        wb.x = wb.swimStartX + (wb.swimTargetX - wb.swimStartX) * t;
        // 水下冒泡
        if (wb.swimTimer % 6 === 0) {
            spawnParticles(wb.x + wb.w / 2 + (Math.random() - 0.5) * 40, WATER_SURFACE_Y + 5, 1, '#4af', 1);
        }
        if (t >= 1) {
            wb.x = wb.swimTargetX;
            wb.jumpsAtPos = 0;
            wb.phase = 'wait';
            wb.waitTimer = 0;
            wb.facing = (player.x + player.w / 2 < wb.x + wb.w / 2) ? -1 : 1;
            playSound('splash');
            spawnParticles(wb.x + wb.w / 2, WATER_SURFACE_Y, 15, '#4af', 3);
            screenShake = 4;
        }
    }

    // Boss碰撞玩家（跳跃和水中冲刺阶段）
    if (!player.dead && player.invincible <= 0 && (wb.phase === 'leap' || wb.phase === 'swim')) {
        const ph = getPlayerHitbox();
        if (rectCollide(ph, wb)) {
            playerDie();
        }
    }
}

function drawWaterBossShadow(camX) {
    if (!waterBoss || !waterBoss.alive) return;
    const wb = waterBoss;
    const px = wb.x - camX;
    const surfY = WATER_SURFACE_Y;

    if (wb.phase === 'enter') {
        // 入场阶段：用Boss自身形状绘制水下阴影
        const alpha = Math.min(wb.enterTimer / 80, 1) * 0.45;
        if (alpha <= 0) return;
        ctx.save();
        // 只绘制水面以下部分
        ctx.beginPath();
        ctx.rect(0, surfY, W, H - surfY);
        ctx.clip();
        ctx.globalAlpha = alpha;
        ctx.translate(px + wb.w / 2, wb.y + wb.h / 2);
        drawWaterBossBody(wb);
        ctx.globalAlpha = 1;
        ctx.restore();
    } else if (wb.phase === 'wait' || wb.phase === 'swim' || (wb.phase === 'leap' && wb.y + wb.h > surfY)) {
        // 等待阶段或跳跃中部分在水下：用Boss形状绘制水下阴影
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, surfY, W, H - surfY);
        ctx.clip();
        ctx.globalAlpha = 0.3;
        ctx.translate(px + wb.w / 2, wb.y + wb.h / 2);
        ctx.scale(wb.facing, 1);
        drawWaterBossBody(wb);
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

function drawWaterBoss(camX) {
    if (!waterBoss || !waterBoss.alive) return;
    const wb = waterBoss;
    // 水下冲刺阶段不绘制主体（只显示阴影）
    if (wb.phase === 'swim') return;
    const px = wb.x - camX;
    const py = wb.y;
    const surfY = WATER_SURFACE_Y;

    // 入场阶段：Boss从水中浮现
    if (wb.phase === 'enter') {
        if (wb.enterTimer < 60) return; // 还在深处不可见
        const aboveAlpha = Math.min((wb.enterTimer - 60) / 60, 1);
        if (aboveAlpha <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, surfY);
        ctx.clip();
        ctx.globalAlpha = aboveAlpha;
        ctx.translate(px + wb.w / 2, wb.y + wb.h / 2);
        ctx.scale(wb.facing, 1);
        drawWaterBossBody(wb);
        ctx.globalAlpha = 1;
        ctx.restore();
        return;
    }

    // 等待阶段：只显示水面以上部分
    if (wb.phase === 'wait') {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, surfY);
        ctx.clip();
        ctx.translate(px + wb.w / 2, py + wb.h / 2);
        ctx.scale(wb.facing, 1);
        drawWaterBossBody(wb);
        ctx.restore();
        return;
    }

    // 跳跃阶段：裁剪水面以上部分显示
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, surfY);
    ctx.clip();
    ctx.translate(px + wb.w / 2, py + wb.h / 2);
    ctx.rotate(wb.rotation);
    ctx.scale(wb.facing, 1);
    drawWaterBossBody(wb);
    ctx.restore();

    // 血量条
    const hpRatio = wb.hp / wb.maxHp;
    const barW = 70;
    const bx = px + wb.w / 2 - barW / 2;
    const by = Math.min(py - 30, surfY - 35);
    ctx.fillStyle = '#222';
    ctx.fillRect(bx - 1, by - 1, barW + 2, 7);
    ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(bx, by, barW * hpRatio, 5);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(bx - 1, by - 1, barW + 2, 7);
    return;
}

        [[10, 2], [20, 5], [30, 7], [36, 8]].forEach(([rx, ry]) => {
            ctx.beginPath();

    ctx.strokeStyle = '#1a2535';

    ctx.fillStyle = '#1a1a2a';
    ctx.beginPath();
    ctx.ellipse(-25, -9, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2a';
    ctx.beginPath();
    ctx.ellipse(-25, 9, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
}

// ========== 粒子系统 ==========
let particles = [];

function spawnParticles(x, y, count, color, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 1,
            life: 30 + Math.random() * 20,
            color: color,
            size: 2 + Math.random() * 3,
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(camX) {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camX - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

let state = 'start'; // start, playing, paused, gameover, victory, battleresult

function initStorm() {
    // 初始化雨滴
    raindrops = [];
    for (let i = 0; i < 300; i++) {
        raindrops.push({
            x: Math.random() * (W + 200) - 100,
            y: Math.random() * H,
            speed: 6 + Math.random() * 6,
            len: 10 + Math.random() * 18,
            alpha: 0.15 + Math.random() * 0.3,
        });
    }
    // 初始化云层（固定的种子云）
    stormClouds = [];
    for (let i = 0; i < 25; i++) {
        stormClouds.push({
            x: (i * 317 + i * i * 43) % 2000 - 200,
            y: 10 + (i * 67 + i * 23) % 120,
            w: 100 + (i * 89) % 180,
            h: 30 + (i * 41) % 50,
            darkness: 0.6 + (i * 31 % 40) / 100,
            layer: i % 3, // 0=最远最暗, 1=中间, 2=最近最大
        });
    }
    stormClouds.sort((a, b) => a.layer - b.layer);
    stormTimer = 120 + Math.random() * 300;
}

function generateLightningBolt(startX, startY, endY) {
    const segments = [];
    let x = startX;
    let y = startY;
    const dy = (endY - startY) / 12;
    for (let i = 0; i < 12; i++) {
        const nx = x + (Math.random() - 0.5) * 60;
        const ny = y + dy + (Math.random() - 0.5) * 15;
        segments.push({ x1: x, y1: y, x2: nx, y2: ny });
        // 分支
        if (i > 2 && i < 10 && Math.random() < 0.4) {
            const bx = nx + (Math.random() - 0.5) * 40;
            const by = ny + 20 + Math.random() * 30;
            segments.push({ x1: nx, y1: ny, x2: bx, y2: by, branch: true });
        }
        x = nx;
        y = ny;
    }
    return segments;
}

// ========== 碰撞检测 ==========
function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 点到线段距离的平方
function pointSegDistSq(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq < 1) return (px - x1) * (px - x1) + (py - y1) * (py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return (px - cx) * (px - cx) + (py - cy) * (py - cy);
}

// 生成树枝状闪电的线段集合
function generateBoltSegments(x1, y1, x2, y2, depth, maxDepth, segments) {
    if (depth > maxDepth) return;
    const segs = 5 + Math.floor(Math.random() * 3);
    const points = [{x: x1, y: y1}];
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 4) return;
    const perpX = -dy / len, perpY = dx / len;
    for (let j = 1; j < segs; j++) {
        const t = j / segs;
        const displace = (Math.random() - 0.5) * len * 0.35;
        points.push({
            x: x1 + dx * t + perpX * displace,
            y: y1 + dy * t + perpY * displace
        });
    }
    points.push({x: x2, y: y2});
    for (let j = 0; j < points.length - 1; j++) {
        segments.push({x1: points[j].x, y1: points[j].y, x2: points[j+1].x, y2: points[j+1].y});
    }
    for (let j = 1; j < points.length - 1; j++) {
        if (Math.random() < 0.45) {
            const branchLen = len * (0.2 + Math.random() * 0.3);
            const mainAngle = Math.atan2(dy, dx);
            const branchAngle = mainAngle + (Math.random() - 0.5) * 1.4;
            const bx = points[j].x + Math.cos(branchAngle) * branchLen;
            const by = points[j].y + Math.sin(branchAngle) * branchLen;
            generateBoltSegments(points[j].x, points[j].y, bx, by, depth + 1, maxDepth, segments);
        }
    }
}

// 获取玩家当前碰撞箱（考虑蹲下和空中缩成一团）
function getPlayerHitbox() {
    if (player.submerged) {
        // 潜入水中：保持原始碰撞箱（Boss和鱼雷仍可命中）
        return { x: player.x, y: player.y, w: player.w, h: player.h };
    }
    const isCurled = !easyMode && !player.onGround && (player.jumping || player.vy !== 0);
    if (player.ducking) {
        return { x: player.x - 8, y: player.y + player.h - 10, w: 36, h: 10 };
    } else if (isCurled) {
        return { x: player.x, y: player.y + player.h - 24, w: player.w, h: 24 };
    }
    return { x: player.x, y: player.y, w: player.w, h: player.h };
}

function getTile(x, y) {
    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);
    if (ty < 0 || ty >= level.length || tx < 0 || tx >= level[0].length) return 0;
    return level[ty][tx];
}

function isSolid(tile) {
    return tile === 1 || tile === 4;
}

function isPlatform(tile) {
    return tile === 2;
}

function isWater(tile) {
    return tile === 3;
}

function spawnRipple(x, y) {
    ripples.push({ x, y, r: 3, maxR: 18 + Math.random() * 8, alpha: 0.6, growing: true });
}

// 在指定位置左侧找到安全的重生位置（有实心地面且头顶无障碍）
function findSafeRespawn(deathX) {
    const groundY = Math.floor(H / TILE) - 2;
    // 只向左搜索实心地面
    const startTile = Math.floor(deathX / TILE);
    for (let tx = startTile; tx >= 0; tx--) {
        if (isSolid(level[groundY][tx]) && !isSolid(level[groundY - 1][tx]) && !isSolid(level[groundY - 2][tx])) {
            return { x: tx * TILE, y: (groundY - 2) * TILE };
        }
    }
    // 回退到默认位置
    return { x: 3 * TILE, y: (groundY - 2) * TILE };
}

// ========== 玩家物理 ==========
function updatePlayer() {
    if (player.dead) return;

    const speed = 2.2;
    const jumpPower = -7;
    const gravity = 0.22;
    const jumpCutFactor = 0.45; // 松手时截断上升速度的比例

    // 输入处理 - 瞄准方向
    const wantUp = isKeyDown('up');
    const wantDown = isKeyDown('down');
    const wantLeft = isKeyDown('left');
    const wantRight = isKeyDown('right');
    player.aimDiagDown = !player.onGround && wantDown && (wantLeft || wantRight);
    player.aimDown = !player.onGround && wantDown && !wantLeft && !wantRight;
    player.ducking = wantDown && player.onGround;
    if (player.ducking) {
        player.aimDiag = wantUp && (wantLeft || wantRight);
        player.aimingUp = wantUp && !player.aimDiag;
    } else {
        player.aimingUp = wantUp;
        player.aimDiag = wantUp && (wantLeft || wantRight);
    }

    // 水中状态检测与限制
    const waterGroundY = Math.floor(H / TILE) - 2;
    const waterSurfaceY = waterGroundY * TILE;
    player.inWater = isWater(getTile(player.x + player.w / 2, waterSurfaceY + 8))
                  && isWater(getTile(player.x + player.w / 2, waterSurfaceY + TILE / 2));
    if (player.inWater) {
        // S键潜入水中（只在水面上且着陆状态时触发）
        if (isKeyDown('down') && !player.submerged && player.onGround) {
            player.submerged = true;
            player.y = waterSurfaceY - 4;
            player.vy = 0;
        }
        if (player.submerged) {
            // 完全潜入：禁止所有射击和移动
            player.aimingUp = false;
            player.aimDiag = false;
            player.aimDiagDown = false;
            player.aimDown = false;
            player.vx = 0;
            // 松开S键浮出水面
            if (!isKeyDown('down')) {
                player.submerged = false;
                player.y = waterSurfaceY - player.h / 2;
            }
        } else {
            // 半身在水中：禁止向下和斜向下射击
            player.aimDiagDown = false;
            player.aimDown = false;
        }
    } else {
        player.submerged = false;
    }

    // 水平移动（完全潜入时不能移动）
    let moveSpeed = player.ducking ? speed * 0.25 : speed;
    if (player.inWater && !player.submerged && player.onGround) moveSpeed *= 2 / 3;
    if (player.submerged) {
        // 潜入水中时强制静止
        player.vx *= 0.7;
        if (Math.abs(player.vx) < 0.5) player.vx = 0;
    } else if (isKeyDown('left')) {
        player.vx = -moveSpeed;
        player.dir = -1;
    } else if (isKeyDown('right')) {
        player.vx = moveSpeed;
        player.dir = 1;
    } else {
        player.vx *= 0.7;
        if (Math.abs(player.vx) < 0.5) player.vx = 0;
    }

    // 跳跃/飞行
    if (easyMode && !player.ducking) {
        // 简单模式：上下键控制飞行，无按键时悬停
        player.onGround = false;
        player.jumping = false;
        if (isKeyDown('jump') || isKeyDown('up')) {
            player.vy = -4;
        } else if (isKeyDown('down')) {
            player.vy = 3;
        } else {
            player.vy = 0; // 悬停
        }
    } else if (isKeyDown('jump') && !player.jumpHeld && player.jumpCount < 2 && !player.ducking && !player.submerged) {
        player.vy = player.inWater ? jumpPower * 0.7 : jumpPower;
        player.onGround = false;
        player.jumping = true;
        player.jumpHeld = true;
        player.jumpCount++;
    }
    // 空中松手截断上升速度 → 落地更早，实现短跳
    if (!easyMode && player.jumping && !isKeyDown('jump') && player.jumpHeld && player.vy < 0) {
        player.vy *= jumpCutFactor;
        player.jumpHeld = false;
    }
    if (!isKeyDown('jump')) player.jumpHeld = false;

    // 射击
    if (player.fireTimer > 0) player.fireTimer--;
    if (isKeyDown('fire') && player.fireTimer <= 0) {
        firePlayerBullet();
        player.fireTimer = player.weapon === 'rapid' ? 12 : player.fireRate;
    }

    // R键切换武器
    if (keys['KeyR'] && !player.rHeld) {
        player.rHeld = true;
        const list = player.obtainedWeapons;
        if (list.length > 1) {
            const idx = list.indexOf(player.weapon);
            player.weapon = list[(idx + 1) % list.length];
            playSound('powerup');
        }
    }
    if (!keys['KeyR']) player.rHeld = false;

    // 重力
    if (easyMode) {
        // 简单模式：空中无重力（悬停），落地后正常重力
        if (!player.onGround) {
            player.vy += 0; // 无重力
        } else {
            player.vy += gravity;
        }
    } else {
        player.vy += gravity;
    }
    if (player.vy > 5) player.vy = 5;

    // 移动和碰撞 - X轴
    player.x += player.vx;
    // 空中缩成一团，碰撞体积更小
    const isCurled = !easyMode && !player.onGround && (player.jumping || player.vy !== 0);
    const ph = isCurled ? 24 : (player.ducking ? 10 : player.h);
    const py = isCurled ? player.y + player.h - 24 : (player.ducking ? player.y + player.h - 10 : player.y);
    const effW = player.ducking ? 36 : player.w;
    const effX = player.ducking ? player.x - 8 : player.x;

    // 左右碰撞
    if (player.vx > 0) {
        for (let checkY = py + 2; checkY < py + ph - 2; checkY += 8) {
            if (isSolid(getTile(effX + effW, checkY))) {
                player.x = Math.floor((effX + effW) / TILE) * TILE - effW + 8;
                player.vx = 0;
                break;
            }
        }
    } else if (player.vx < 0) {
        for (let checkY = py + 2; checkY < py + ph - 2; checkY += 8) {
            if (isSolid(getTile(effX, checkY))) {
                player.x = Math.floor(effX / TILE) * TILE + TILE + 8;
                player.vx = 0;
                break;
            }
        }
    }

    // 不超出关卡
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x > (LEVEL_WIDTH - 1) * TILE) { player.x = (LEVEL_WIDTH - 1) * TILE; player.vx = 0; }
    // 屏幕锁定时不能移出屏幕
    if (cameraLocked) {
        if (player.x < camera.x) { player.x = camera.x; player.vx = 0; }
        if (player.x + player.w > camera.x + W) { player.x = camera.x + W - player.w; player.vx = 0; }
    }
    if (player.y < 0) { player.y = 0; player.vy = 0; }

    // 移动和碰撞 - Y轴
    player.y += player.vy;
    player.onGround = false;

    if (player.vy > 0) {
        // 下落 - 检测地面
        let landed = false;
        for (let checkX = effX + 2; checkX < effX + effW - 2; checkX += 6) {
            const tile = getTile(checkX, player.y + player.h);
            if (isSolid(tile) || (isPlatform(tile) && player.vy >= 0)) {
                player.y = Math.floor((player.y + player.h) / TILE) * TILE - player.h;
                player.vy = 0;
                player.onGround = true;
                player.jumping = false;
                player.jumpCount = 0;
                landed = true;
                break;
            }
        }
        // 水面碰撞：踩到水面时半身入水
        if (!landed) {
            for (let checkX = effX + 2; checkX < effX + effW - 2; checkX += 6) {
                if (isWater(getTile(checkX, player.y + player.h))) {
                    player.y = waterGroundY * TILE - player.h / 2;
                    player.vy = 0;
                    player.onGround = true;
                    player.jumping = false;
                    player.jumpCount = 0;
                    break;
                }
            }
        }
    } else if (player.vy < 0) {
        // 上升 - 检测头顶
        for (let checkX = effX + 2; checkX < effX + effW - 2; checkX += 6) {
            if (isSolid(getTile(checkX, player.y))) {
                player.y = Math.floor(player.y / TILE) * TILE + TILE;
                player.vy = 0;
                break;
            }
        }
    }

    // 移动平台碰撞
    if (!player.onGround && player.vy >= 0) {
        for (const mp of movingPlatforms) {
            if (effX + effW > mp.x + 4 && effX < mp.x + mp.w - 4) {
                const platTop = mp.y;
                if (player.y + player.h >= platTop && player.y + player.h <= platTop + 10) {
                    player.y = platTop - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    player.jumping = false;
                    player.jumpCount = 0;
                    // 随平台移动，检查地形碰撞
                    if (mp.dx) {
                        player.x += mp.dx;
                        // 重新计算碰撞箱
                        const newEffX = player.ducking ? player.x - 8 : player.x;
                        const newEffW = player.ducking ? 36 : player.w;
                        const newPy = player.ducking ? player.y + player.h - 10 : player.y;
                        const newPh = player.ducking ? 10 : player.h;
                        // 检查玩家是否被平台推入地形
                        if (mp.dx > 0) {
                            for (let checkY = newPy + 2; checkY < newPy + newPh - 2; checkY += 8) {
                                if (isSolid(getTile(newEffX + newEffW, checkY))) {
                                    player.x = Math.floor((newEffX + newEffW) / TILE) * TILE - newEffW + 8;
                                    break;
                                }
                            }
                        } else if (mp.dx < 0) {
                            for (let checkY = newPy + 2; checkY < newPy + newPh - 2; checkY += 8) {
                                if (isSolid(getTile(newEffX, checkY))) {
                                    player.x = Math.floor(newEffX / TILE) * TILE + TILE + 8;
                                    break;
                                }
                            }
                        }
                    }
                    break;
                }
            }
        }
    }

    // 掉出屏幕死亡
    if (player.y > H + 50) {
        playerDie();
    }

    // 动画
    player.animTimer++;
    const animSpeed = (!player.onGround && player.jumping) ? 3 : 6; // 空中翻滚更快
    if (player.animTimer > animSpeed) {
        player.animTimer = 0;
        player.animFrame = (player.animFrame + 1) % 4;
    }

    // 无敌时间
    if (player.invincible > 0) player.invincible--;

    // 水中波纹效果
    if (player.inWater) {
        if (player.submerged) {
            if (Math.random() < 0.12) spawnRipple(player.x + player.w / 2 + (Math.random() - 0.5) * 14, waterSurfaceY);
            if (Math.random() < 0.08) spawnRipple(player.x + player.w / 2 + (Math.random() - 0.5) * 22, waterSurfaceY);
            if (Math.random() < 0.04) spawnRipple(player.x + player.w / 2 + (Math.random() - 0.5) * 30, waterSurfaceY);
        } else if (Math.abs(player.vx) > 0.3 && Math.random() < 0.15) {
            spawnRipple(player.x + player.w / 2, waterSurfaceY);
        }
    }

    // 关卡滚动
    if (cameraLocked) {
        camera.x = cameraLockX;
    } else {
        const targetCamX = player.x - W / 3;
        camera.x += (targetCamX - camera.x) * 0.1;
        if (camera.x < 0) camera.x = 0;
        const maxCam = LEVEL_WIDTH * TILE - W;
        if (camera.x > maxCam) camera.x = maxCam;
    }

    // Boss触发
    if (!bossTriggered && player.x > (LEVEL_WIDTH - 12) * TILE) {
        bossTriggered = true;
        boss = createBoss((LEVEL_WIDTH - 5) * TILE, (Math.floor(H / TILE) - 2) * TILE);
        // 清除屏幕上的小兵
        enemies.forEach(e => { if (e.x < camera.x + W + 200) e.active = true; });
    }

    // 水路Boss触发
    if (!waterBoss && !waterBossIntro && player.x > 130 * TILE && player.x < 158 * TILE) {
        waterBossIntro = true;
        waterBoss = createWaterBoss(camera.x);
        cameraLocked = true;
        cameraLockX = camera.x;
    }
}

// ========== 玩家子弹 ==========
function firePlayerBullet() {
    if (player.dead || player.submerged) return;

    const speed = 5;
    const sfxMap = { normal: 'shoot', spread: 'spread', rapid: 'rapid', spiral: 'spiral', lightning: 'lightning', homing: 'homing' };
    let fired = false;

    // 计算射击角度
    let baseAngle;
    if (player.ducking) {
        if (player.aimDiag) {
            baseAngle = player.dir > 0 ? -Math.PI / 4 : -Math.PI * 3 / 4;
        } else if (player.aimingUp) {
            baseAngle = -Math.PI / 2;
        } else {
            baseAngle = player.dir > 0 ? 0 : Math.PI;
        }
    } else if (player.aimDiag) {
        const diagDir = isKeyDown('left') ? -1 : 1;
        baseAngle = diagDir > 0 ? -Math.PI / 4 : -Math.PI * 3 / 4;
    } else if (player.aimingUp) {
        baseAngle = -Math.PI / 2;
    } else if (player.aimDiagDown) {
        const diagDir = isKeyDown('left') ? -1 : 1;
        baseAngle = diagDir > 0 ? Math.PI / 4 : Math.PI * 3 / 4;
    } else if (player.aimDown) {
        baseAngle = Math.PI / 2;
    } else {
        baseAngle = player.dir > 0 ? 0 : Math.PI;
    }

    // 子弹起点：从枪口射出
    let bx, by;
    if (player.ducking) {
        const gunPivotX = player.dir > 0 ? player.x + 20 : player.x - 12;
        const gunPivotY = player.y + player.h - 2;
        bx = gunPivotX + Math.cos(baseAngle) * 16;
        by = gunPivotY + Math.sin(baseAngle) * 16;
    } else {
        // 枪口位置（与绘制对齐：枪支点在 (centerX+2, y+6)，枪管长16）
        const pivotX = player.x + player.w / 2 + 2;
        const pivotY = player.y + 6;
        const barrelLen = 16;
        if (player.aimingUp || player.aimDiag) {
            const gunAngle = player.aimDiag ? -Math.PI / 4 : -Math.PI / 2;
            if (player.dir > 0) {
                bx = pivotX + Math.cos(gunAngle) * barrelLen;
                by = pivotY + Math.sin(gunAngle) * barrelLen;
            } else {
                // 朝左时画布镜像：翻转X偏移
                bx = 2 * (player.x + player.w / 2) - (pivotX + Math.cos(gunAngle) * barrelLen);
                by = pivotY + Math.sin(gunAngle) * barrelLen;
            }
        } else if (player.aimDiagDown || player.aimDown) {
            const gunAngle = player.aimDown ? Math.PI / 2 : Math.PI / 4;
            if (player.dir > 0) {
                bx = pivotX + Math.cos(gunAngle) * barrelLen;
                by = pivotY + Math.sin(gunAngle) * barrelLen;
            } else {
                bx = 2 * (player.x + player.w / 2) - (pivotX + Math.cos(gunAngle) * barrelLen);
                by = pivotY + Math.sin(gunAngle) * barrelLen;
            }
        } else {
            // 水平射击
            bx = player.dir > 0 ? player.x + player.w / 2 + 18 : player.x + player.w / 2 - 18;
            by = player.y + 6;
        }
    }

    // 为子弹锁定最近目标（简单模式或K型导弹）
    function findTarget(forceFind) {
        if (!easyMode && !forceFind) return null;
        let best = null, bestDist = Infinity;
        for (const e of enemies) {
            if (!e.alive || !e.active) continue;
            const dx = (e.x + e.w/2) - bx;
            const dy = (e.y + e.h/2) - by;
            const d = dx*dx + dy*dy;
            if (d < bestDist) { bestDist = d; best = e; }
        }
        if (boss && boss.alive) {
            const dx = (boss.x + boss.w/2) - bx;
            const dy = (boss.y + boss.h/2) - by;
            const d = dx*dx + dy*dy;
            if (d < bestDist) { best = boss; bestDist = d; }
        }
        if (waterBoss && waterBoss.alive) {
            const dx = (waterBoss.x + waterBoss.w/2) - bx;
            const dy = (waterBoss.y + waterBoss.h/2) - by;
            const d = dx*dx + dy*dy;
            if (d < bestDist) { best = waterBoss; }
        }
        return best;
    }

    if (player.weapon === 'spread') {
        const spreadCount = bullets.filter(b => b.weaponType === 'spread').length;
        if (spreadCount < 14) {
            const spread = 0.12;
            const angles = [];
            for (let i = -3; i <= 3; i++) angles.push(baseAngle + spread * i);
            angles.forEach(a => {
                bullets.push({
                    x: bx, y: by,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed,
                    w: 10, h: 6,
                    damage: 1,
                    life: 200,
                    target: findTarget(),
                    weaponType: 'spread',
                });
            });
            fired = true;
        }
    } else if (player.weapon === 'rapid') {
        bullets.push({
            x: bx, y: by,
            vx: Math.cos(baseAngle) * speed,
            vy: Math.sin(baseAngle) * speed,
            w: 8, h: 4,
            damage: 1,
            life: 200,
            target: findTarget(),
            weaponType: 'rapid',
        });
        fired = true;
    } else if (player.weapon === 'spiral') {
        const spiralCount = bullets.filter(b => b.weaponType === 'spiral').length;
        if (spiralCount < 7) {
            player.spiralAngle += 0.6;
            bullets.push({
                x: bx, y: by,
                vx: Math.cos(baseAngle) * speed,
                vy: Math.sin(baseAngle) * speed,
                w: 6, h: 6,
                damage: 1,
                life: 200,
                target: findTarget(),
                weaponType: 'spiral',
                time: 0,
                baseAngle: baseAngle,
            });
            fired = true;
        }
    } else if (player.weapon === 'lightning') {
        const boltLen = 360;
        const endX = bx + Math.cos(baseAngle) * boltLen;
        const endY = by + Math.sin(baseAngle) * boltLen;
        const segments = [];
        generateBoltSegments(bx, by, endX, endY, 0, 3, segments);
        bullets.push({
            x: bx, y: by,
            vx: 0, vy: 0,
            w: boltLen, h: 0,
            damage: 4,
            life: 8,
            weaponType: 'lightning',
            pierceWalls: true,
            stationary: true,
            angle: baseAngle,
            hitEnemies: new Set(),
            segments: segments,
        });
        fired = true;
    } else if (player.weapon === 'homing') {
        const homingCount = bullets.filter(b => b.weaponType === 'homing').length;
        if (homingCount < 3) {
            bullets.push({
                x: bx, y: by,
                vx: Math.cos(baseAngle) * speed * 0.5,
                vy: Math.sin(baseAngle) * speed * 0.5,
                w: 12, h: 6,
                damage: 2,
                life: 300,
                target: findTarget(true),
                weaponType: 'homing',
            });
            fired = true;
        }
    } else {
        bullets.push({
            x: bx, y: by,
            vx: Math.cos(baseAngle) * speed,
            vy: Math.sin(baseAngle) * speed,
            w: 8, h: 4,
            damage: 1,
            life: 200,
            target: findTarget(),
            weaponType: 'spread',
        });
        fired = true;
    }

    // 只有子弹实际射出时才播放音效
    if (fired) playSound(sfxMap[player.weapon] || 'shoot');
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        // 追踪逻辑：简单模式所有子弹追踪，或K型导弹始终追踪
        const shouldTrack = (easyMode && b.target && b.target.alive !== false) ||
                           (b.weaponType === 'homing' && b.target && b.target.alive !== false);
        if (shouldTrack) {
            // K型导弹需要实时寻找最近目标
            if (b.weaponType === 'homing') {
                let best = null, bestDist = Infinity;
                for (const e of enemies) {
                    if (!e.alive || !e.active) continue;
                    const dx = (e.x + e.w/2) - b.x;
                    const dy = (e.y + e.h/2) - b.y;
                    const d = dx*dx + dy*dy;
                    if (d < bestDist) { bestDist = d; best = e; }
                }
                if (boss && boss.alive) {
                    const dx = (boss.x + boss.w/2) - b.x;
                    const dy = (boss.y + boss.h/2) - b.y;
                    const d = dx*dx + dy*dy;
                    if (d < bestDist) { best = boss; }
                }
                if (best) b.target = best;
            }
            if (b.target && b.target.alive !== false) {
                const tx = (b.target.x + b.target.w/2);
                const ty = (b.target.y + b.target.h/2);
                const dx = tx - b.x;
                const dy = ty - b.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 1) {
                    const spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
                    const steer = b.weaponType === 'homing' ? 0.08 : 0.6;
                    b.vx += (dx / dist) * spd * steer;
                    b.vy += (dy / dist) * spd * steer;
                    const newSpd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
                    b.vx = b.vx / newSpd * spd;
                    b.vy = b.vy / newSpd * spd;
                }
            }
        }

        // T型闪电电弧：不移动，闪电形状碰撞
        if (b.stationary) {
            b.life--;
            const hitRadius = 324; // 18px 的平方
            // 检查敌人是否在闪电线段附近
            for (const e of enemies) {
                if (!e.alive || !e.active) continue;
                if (b.hitEnemies.has(e)) continue;
                const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
                let nearBolt = false;
                for (const s of b.segments) {
                    if (pointSegDistSq(ecx, ecy, s.x1, s.y1, s.x2, s.y2) < hitRadius) {
                        nearBolt = true;
                        break;
                    }
                }
                if (nearBolt) {
                    e.hp -= b.damage;
                    b.hitEnemies.add(e);
                    if (e.hp <= 0) {
                        e.alive = false;
                        score += e.type === 'turret' ? 500 : 200;
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, 15, '#0af', 4);
                        playSound('explosion');
                        screenShake = 5;
                        if (Math.random() < 0.2) spawnPowerup(e.x, e.y);
                    } else {
                        spawnParticles(ecx, ecy, 5, '#0ff', 2);
                        playSound('hit');
                    }
                }
            }
            // Boss伤害
            if (boss && boss.alive && !b.hitEnemies.has(boss)) {
                const bcx = boss.x + boss.w / 2, bcy = boss.y + boss.h / 2;
                let nearBolt = false;
                for (const s of b.segments) {
                    if (pointSegDistSq(bcx, bcy, s.x1, s.y1, s.x2, s.y2) < hitRadius) {
                        nearBolt = true;
                        break;
                    }
                }
                if (nearBolt) {
                    boss.hp -= b.damage;
