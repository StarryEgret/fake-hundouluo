                    b.hitEnemies.add(boss);
                    spawnParticles(bcx, bcy, 5, '#0af', 2);
                    playSound('hit');
                    screenShake = 3;
                    if (boss.hp <= 0) {
                        boss.alive = false;
                        score += 5000;
                        spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, 50, '#f80', 6);
                        playSound('explosion');
                        screenShake = 15;
                        state = 'victory';
                        stopBGM();
                        victoryTimer = 180;
                        if (multiplayerMode) sendBattleResult('victory');
                    }
                }
            }
            // 水路Boss伤害（闪电）
            if (waterBoss && waterBoss.alive && !b.hitEnemies.has(waterBoss)) {
                const wcx = waterBoss.x + waterBoss.w / 2, wcy = waterBoss.y + waterBoss.h / 2;
                let nearBoltW = false;
                for (const s of b.segments) {
                    if (pointSegDistSq(wcx, wcy, s.x1, s.y1, s.x2, s.y2) < hitRadius) {
                        nearBoltW = true;
                        break;
                    }
                }
                if (nearBoltW) {
                    if (waterBoss.phase === 'leap') {
                        waterBoss.hp -= b.damage;
                        b.hitEnemies.add(waterBoss);
                        spawnParticles(wcx, wcy, 5, '#0af', 2);
                        playSound('wbHit');
                        screenShake = 3;
                        if (waterBoss.hp <= 0) {
                            waterBoss.alive = false;
                            cameraLocked = false;
                            score += 8000;
                            spawnParticles(waterBoss.x + waterBoss.w / 2, waterBoss.y + waterBoss.h / 2, 50, '#f80', 6);
                            playSound('explosion');
                            screenShake = 15;
                            spawnPowerup(waterBoss.x + waterBoss.w / 2, waterBoss.y);
                        }
                    }
                }
            }
            if (b.life <= 0) bullets.splice(i, 1);
            continue;
        }

        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // F型螺旋弹：拉长弹簧状波形
        if (b.weaponType === 'spiral') {
            b.time = (b.time || 0) + 1;
            const angle = b.baseAngle || Math.atan2(b.vy, b.vx);
            const perpX = -Math.sin(angle);
            const perpY = Math.cos(angle);
            const amp = Math.min(b.time * 0.15, 1) * 6 * Math.sin(b.time * 0.4);
            b.x += perpX * amp;
            b.y += perpY * amp;
        }

        // 碰撞检测地形
        if (isSolid(getTile(b.x, b.y))) {
            spawnParticles(b.x, b.y, 3, '#ff0', 2);
            bullets.splice(i, 1);
            continue;
        }

        // 碰撞检测敌人
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (!e.alive || !e.active) continue;
            if (e.inTree && !e.peeking) continue;
            if (rectCollide(b, e)) {
                e.hp -= b.damage;
                if (e.hp <= 0) {
                    e.alive = false;
                    score += e.type === 'turret' ? 500 : 200;
                    spawnParticles(e.x + e.w/2, e.y + e.h/2, 15, '#f80', 4);
                    playSound('explosion');
                    screenShake = 5;
                    if (Math.random() < 0.2) spawnPowerup(e.x, e.y);
                } else {
                    spawnParticles(b.x, b.y, 5, '#ff0', 2);
                    playSound('hit');
                }
                hit = true;
                break;
            }
        }

        // Boss碰撞
        if (boss && boss.alive && !hit) {
            if (rectCollide(b, boss)) {
                boss.hp -= b.damage;
                spawnParticles(b.x, b.y, 5, '#f00', 2);
                playSound('hit');
                screenShake = 3;
                if (boss.hp <= 0) {
                    boss.alive = false;
                    score += 5000;
                    spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, 50, '#f80', 6);
                    playSound('explosion');
                    screenShake = 15;
                    state = 'victory';
                    stopBGM();
                    victoryTimer = 180;
                    if (multiplayerMode) sendBattleResult('victory');
                }
                hit = true;
            }
        }

        // 水路Boss碰撞
        if (waterBoss && waterBoss.alive && !hit) {
            if (rectCollide(b, waterBoss)) {
                if (waterBoss.phase === 'leap') {
                    // 跳跃阶段：S型子弹只造成1/4伤害
                    const dmg = (b.weaponType === 'spread') ? b.damage * 0.25 : b.damage;
                    waterBoss.hp -= dmg;
                    spawnParticles(b.x, b.y, 5, '#f00', 2);
                    playSound('wbHit');
                    screenShake = 3;
                    if (waterBoss.hp <= 0) {
                        waterBoss.alive = false;
                        cameraLocked = false;
                        score += 8000;
                        spawnParticles(waterBoss.x + waterBoss.w/2, waterBoss.y + waterBoss.h/2, 50, '#f80', 6);
                        playSound('explosion');
                        screenShake = 15;
                        spawnPowerup(waterBoss.x + waterBoss.w/2, waterBoss.y);
                    }
                } else {
                    // 水中阶段：T型和K型穿透，其他反弹
                    if (b.weaponType === 'lightning' || b.weaponType === 'spiral') {
                        spawnParticles(b.x, b.y, 3, '#ff0', 2);
                        hit = true;
                    } else {
                        // 反弹成敌人子弹
                        enemyBullets.push({
                            x: b.x, y: b.y,
                            vx: -b.vx * 0.8, vy: -b.vy * 0.8,
                            w: b.w, h: b.h,
                            type: 'heavy',
                        });
                        spawnParticles(b.x, b.y, 4, '#ff0', 2);
                        playSound('hit');
                        hit = true;
                    }
                }
            }
        }

        if (hit || b.life <= 0) {
            bullets.splice(i, 1);
        }
    }
}

// ========== 敌人子弹 ==========
function enemyFire(e) {
    const speed = 2.2;
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    enemyBullets.push({
        x: e.x + e.w / 2,
        y: e.y + e.h / 2,
        vx: dx * speed,
        vy: dy * speed,
        w: 6, h: 6,
    });
}

// 炮台特殊子弹 - 三向散射
function turretFire(e) {
    const speed = 2.8;
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    // 中心子弹
    enemyBullets.push({
        x: e.x + e.w / 2,
        y: e.y + e.h / 2,
        vx: dx * speed,
        vy: dy * speed,
        w: 8, h: 8,
        special: true,
    });

    // 左右散射子弹（偏移15度）
    const spreadAngle = 0.26; // ~15度
    for (const angle of [-spreadAngle, spreadAngle]) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        enemyBullets.push({
            x: e.x + e.w / 2,
            y: e.y + e.h / 2,
            vx: (dx * cos - dy * sin) * speed,
            vy: (dx * sin + dy * cos) * speed,
            w: 8, h: 8,
            special: true,
        });
    }
}

// 喷火器 - 短程火焰
function flamerFire(e) {
    const speed = 3.5;
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    // 扇形火焰（3发）
    for (let i = -1; i <= 1; i++) {
        const angle = Math.atan2(dy, dx) + i * 0.2;
        enemyBullets.push({
            x: e.x + e.w / 2,
            y: e.y + e.h / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            w: 10, h: 10,
            special: true,
            type: 'fire',
            life: 25, // 短程
        });
    }
}

// 闪电枪 - 快速直线闪电
function lightningFire(e) {
    const speed = 5;
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    enemyBullets.push({
        x: e.x + e.w / 2,
        y: e.y + e.h / 2,
        vx: dx * speed,
        vy: dy * speed,
        w: 6, h: 6,
        special: true,
        type: 'lightning',
        life: 40,
    });
}

// 重装兵 - 大口径子弹
function heavyFire(e) {
    const speed = 2;
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    dx /= dist; dy /= dist;

    enemyBullets.push({
        x: e.x + e.w / 2,
        y: e.y + e.h / 2,
        vx: dx * speed,
        vy: dy * speed,
        w: 12, h: 12,
        special: true,
        type: 'heavy',
    });
}

function updateEnemyBullets() {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // 特殊子弹生命周期
        if (b.life !== undefined) {
            b.life--;
            if (b.life <= 0) {
                enemyBullets.splice(i, 1);
                continue;
            }
        }

        // 碰撞地形（火焰、闪电、鱼雷不检测地形碰撞）
        if (b.type !== 'fire' && b.type !== 'lightning' && b.type !== 'torpedo') {
            if (isSolid(getTile(b.x, b.y))) {
                enemyBullets.splice(i, 1);
                continue;
            }
        }

        // 超出屏幕移除
        if (b.x < camera.x - 50 || b.x > camera.x + W + 50 || b.y < -50 || b.y > H + 50) {
            enemyBullets.splice(i, 1);
            continue;
        }

        // 碰撞玩家（鱼雷在水中也能命中，其他子弹潜水时不受击）
        const canHit = !player.submerged || b.type === 'torpedo';
        if (!player.dead && player.invincible <= 0 && canHit) {
            const ph = getPlayerHitbox();
            if (rectCollide(b, ph)) {
                if (b.type === 'torpedo') {
                    // 鱼雷爆炸效果
                    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, 20, '#f80', 5);
                    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, 10, '#ff0', 4);
                    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, 8, '#f00', 3);
                    screenShake = 8;
                    playSound('explosion');
                }
                playerDie();
                enemyBullets.splice(i, 1);
            }
        }
    }}

// ========== 敌人AI ==========
function updateEnemies() {
    enemies.forEach(e => {
        if (!e.alive) return;

        // 激活范围
        if (!e.active) {
            if (e.x < camera.x + W + 100 && e.x > camera.x - 100) {
                e.active = true;
            }
            return;
        }

        // 超出范围移除
        if (e.x < camera.x - 200) {
            e.alive = false;
            return;
        }

        if (e.type === 'turret') {
            // 炮台特殊射击（三向散射）
            e.fireTimer--;
            if (e.fireTimer <= 0) {
                const dist = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);
                if (dist < 400) {
                    turretFire(e);
                }
                e.fireTimer = 120 + Math.random() * 80;
            }
        } else if (e.inTree) {
            // 树冠敌人行为
            e.peekTimer--;
            if (!e.peeking && e.peekTimer <= 0) {
                // 开始探出身体攻击
                e.peeking = true;
                e.peekDuration = 60 + Math.random() * 40;
            }
            if (e.peeking) {
                e.peekDuration--;
                // 射击
                e.fireTimer--;
                if (e.fireTimer <= 0) {
                    const dist = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);
                    if (dist < 400) {
                        e.dir = player.x < e.x ? -1 : 1;
                        enemyFire(e);
                    }
                    e.fireTimer = 40 + Math.random() * 30;
                }
                if (e.peekDuration <= 0) {
                    e.peeking = false;
                    e.peekTimer = 150 + Math.random() * 200;
                }
            }
        } else {
            // 人形敌人通用物理
            let patrolSpeed = 0.42;
            if (e.type === 'runner') patrolSpeed = 0.84;
            else if (e.type === 'heavy') patrolSpeed = 0.24;
            else if (e.type === 'flamer') patrolSpeed = 0.36;
            else if (e.type === 'lightning') patrolSpeed = 0.48;
            // 水中减速
            if (e.inWater) patrolSpeed *= 2 / 3;

            const distToPlayer = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);

            // 水平移动（保持生成方向，撞墙才回头）
            e.vx = e.dir * patrolSpeed;
            e.x += e.vx;

            // 左右碰撞 — 沿身体多点采样并钉到墙外
            let wallBlocked = false;
            if (e.vx > 0) {
                for (let cy = e.y + 4; cy < e.y + e.h - 4; cy += 8) {
                    if (isSolid(getTile(e.x + e.w, cy))) {
                        e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
                        wallBlocked = true;
                        break;
                    }
                }
                if (wallBlocked) e.dir = -1;
            } else if (e.vx < 0) {
                for (let cy = e.y + 4; cy < e.y + e.h - 4; cy += 8) {
                    if (isSolid(getTile(e.x, cy))) {
                        e.x = Math.floor(e.x / TILE) * TILE + TILE;
                        wallBlocked = true;
                        break;
                    }
                }
                if (wallBlocked) e.dir = 1;
            }

            // 敌人跳跃：撞墙或玩家在上方时跳跃
            if (e.onGround) {
                const shouldJump = wallBlocked || (distToPlayer < 250 && player.y < e.y - 40);
                if (shouldJump && Math.random() < 0.05) {
                    e.vy = -7; // 类似玩家的跳跃力
                    e.onGround = false;
                }
            }

            // 重力（空降兵开伞时大幅减小重力）
            if (e.type === 'paratrooper' && e.parachuting) {
                e.vy += 0.02;
                if (e.vy > 0.5) e.vy = 0.5;
            } else {
                e.vy += 0.3;
                if (e.vy > 6) e.vy = 6;
            }
            e.y += e.vy;

            // 地面碰撞
            e.onGround = false;
            if (e.vy >= 0) {
                let enemyLanded = false;
                for (let cx = e.x + 2; cx < e.x + e.w - 2; cx += 6) {
                    const tile = getTile(cx, e.y + e.h);
                    if (isSolid(tile) || isPlatform(tile)) {
                        e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
                        e.vy = 0;
                        e.onGround = true;
                        enemyLanded = true;
                        break;
                    }
                }
                // 水面碰撞：敌人也半身入水
                if (!enemyLanded) {
                    const eGroundY = Math.floor(H / TILE) - 2;
                    for (let cx = e.x + 2; cx < e.x + e.w - 2; cx += 6) {
                        if (isWater(getTile(cx, e.y + e.h))) {
                            e.y = eGroundY * TILE - e.h / 2;
                            e.vy = 0;
                            e.onGround = true;
                            e.inWater = true;
                            break;
                        }
                    }
                }
            }
            // 检测敌人是否在水中（用于减速）
            if (!e.inWater) {
                const eGroundY2 = Math.floor(H / TILE) - 2;
                e.inWater = isWater(getTile(e.x + e.w / 2, eGroundY2 * TILE + 8));
            }

            // 头顶碰撞
            if (e.vy < 0) {
                for (let cx = e.x + 2; cx < e.x + e.w - 2; cx += 6) {
                    if (isSolid(getTile(cx, e.y))) {
                        e.y = Math.floor(e.y / TILE) * TILE + TILE;
                        e.vy = 0;
                        break;
                    }
                }
            }

            // 掉出屏幕移除
            if (e.y > H + 100) { e.alive = false; return; }

            // 空降兵降落逻辑
            if (e.type === 'paratrooper' && e.parachuting) {
                // 向玩家方向水平飘移
                if (player.x < e.x - 5) {
                    e.x -= e.driftSpeed;
                    e.dir = -1;
                } else if (player.x > e.x + 5) {
                    e.x += e.driftSpeed;
                    e.dir = 1;
                }
                // 空中射击
                e.fireTimer--;
                if (e.fireTimer <= 0) {
                    const distToPlayer2 = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);
                    if (distToPlayer2 < 300) {
                        paratrooperFire(e);
                    }
                    e.fireTimer = 120 + Math.random() * 80;
                }
                if (e.onGround) {
                    // 着陆后变成普通士兵
                    e.parachuting = false;
                    e.type = 'soldier';
                    e.vy = 0;
                }
            }

            if (e.type === 'soldier' || (e.type === 'paratrooper' && !e.parachuting)) {
                e.fireTimer--;
                if (e.fireTimer <= 0 && distToPlayer < 350) {
                    enemyFire(e);
                    e.fireTimer = 80 + Math.random() * 80;
                }
                e.animTimer++;
                if (e.animTimer > 8) {
                    e.animTimer = 0;
                    e.animFrame = (e.animFrame + 1) % 2;
                }
            } else if (e.type === 'runner') {
                e.fireTimer--;
                if (e.fireTimer <= 0 && distToPlayer < 250) {
                    enemyFire(e);
                    e.fireTimer = 50 + Math.random() * 40;
                }
                e.animTimer++;
                if (e.animTimer > 4) {
                    e.animTimer = 0;
                    e.animFrame = (e.animFrame + 1) % 4;
                }
            } else if (e.type === 'flamer') {
                e.fireTimer--;
                if (e.fireTimer <= 0 && distToPlayer < 150) {
                    flamerFire(e);
                    e.fireTimer = 30 + Math.random() * 30;
                }
                e.animTimer++;
                if (e.animTimer > 6) {
                    e.animTimer = 0;
                    e.animFrame = (e.animFrame + 1) % 2;
                }
            } else if (e.type === 'lightning') {
                e.fireTimer--;
                if (e.fireTimer <= 0 && distToPlayer < 350) {
                    lightningFire(e);
                    e.fireTimer = 60 + Math.random() * 40;
                }
                e.animTimer++;
                if (e.animTimer > 5) {
                    e.animTimer = 0;
                    e.animFrame = (e.animFrame + 1) % 2;
                }
            } else if (e.type === 'heavy') {
                e.fireTimer--;
                if (e.fireTimer <= 0 && distToPlayer < 300) {
                    heavyFire(e);
                    e.fireTimer = 100 + Math.random() * 80;
                }
                e.animTimer++;
                if (e.animTimer > 10) {
                    e.animTimer = 0;
                    e.animFrame = (e.animFrame + 1) % 2;
                }
            }
        }

        // 碰撞玩家（完全潜入水中时不被击中）
        if (!player.dead && player.invincible <= 0 && !player.submerged) {
            const ph = getPlayerHitbox();
            if (rectCollide(ph, e)) {
                playerDie();
            }
        }
    });
}

// ========== Boss AI ==========
function updateBoss() {
    if (!boss || !boss.alive) return;

    boss.animTimer++;
    boss.moveTimer++;
    boss.fireTimer--;

    // 移动模式
    if (boss.moveTimer > 120) {
        boss.moveTimer = 0;
        boss.phase = (boss.phase + 1) % 3;
    }

    switch(boss.phase) {
        case 0: // 左右移动
            boss.x += Math.sin(boss.animTimer * 0.03) * 2;
            break;
        case 1: // 冲向玩家
            const dx = player.x < boss.x ? -1.5 : 1.5;
            boss.x += dx;
            break;
        case 2: // 停止射击
            break;
    }

    // 射击
    if (boss.fireTimer <= 0) {
        const patterns = [
            // 散射
            () => {
                for (let a = -0.6; a <= 0.6; a += 0.3) {
                    const angle = Math.atan2(player.y - boss.y, player.x - boss.x) + a;
                    enemyBullets.push({
                        x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                        vx: Math.cos(angle) * 2.5, vy: Math.sin(angle) * 2.5,
                        w: 8, h: 8,
                    });
                }
            },
            // 直射
            () => {
                const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        if (boss.alive) {
                            enemyBullets.push({
                                x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                                vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3,
                                w: 8, h: 8,
                            });
                        }
                    }, i * 100);
                }
            },
        ];
        patterns[Math.floor(Math.random() * patterns.length)]();
        boss.fireTimer = 40 + Math.random() * 30;
    }

    // Boss碰撞玩家
    if (!player.dead && player.invincible <= 0) {
        const ph = getPlayerHitbox();
        if (rectCollide(ph, boss)) {
            playerDie();
        }
    }

    // 限制Boss移动范围
    if (boss.x < (LEVEL_WIDTH - 10) * TILE) boss.x = (LEVEL_WIDTH - 10) * TILE;
    if (boss.x > (LEVEL_WIDTH - 3) * TILE) boss.x = (LEVEL_WIDTH - 3) * TILE;
}

// ========== 道具系统 ==========
function spawnPowerup(x, y) {
    const types = ['spread', 'rapid', 'spiral', 'lightning', 'homing', 'life'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x, y, w: 24, h: 24, type, vy: -3, life: 600 });
}

function updatePowerups() {
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.vy += 0.2;
        p.y += p.vy;

        // 地面碰撞
        if (isSolid(getTile(p.x + p.w/2, p.y + p.h))) {
            p.y = Math.floor((p.y + p.h) / TILE) * TILE - p.h;
            p.vy = 0;
        }

        p.life--;
        if (p.life <= 0) { powerups.splice(i, 1); continue; }

        // 玩家拾取
        if (rectCollide(player, p)) {
            playSound('powerup');
            if (p.type === 'life') {
                lives++;
            } else {
                player.weapon = p.type;
                if (!player.obtainedWeapons.includes(p.type)) {
                    player.obtainedWeapons.push(p.type);
                }
            }
            score += 1000;
            powerups.splice(i, 1);
        }
    }
}

// ========== 玩家死亡 ==========
function playerDie() {
    if (player.invincible > 0 || player.dead) return;
    player.dead = true;
    lives--;
    playSound('die');
    spawnParticles(player.x + player.w/2, player.y + player.h/2, 20, '#f44', 5);
    screenShake = 10;

    if (lives <= 0) {
        setTimeout(() => {
            stopBGM();
            if (score > hiScore) hiScore = score;
            if (multiplayerMode) {
                sendBattleResult('gameover');
                document.getElementById('waitingOverlay').style.display = 'flex';
            } else {
                state = 'gameover';
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }
        }, 1000);
    } else {
        const deathX = player.x;
        const deathInWater = player.inWater;
        const deathOnGround = player.onGround;
        setTimeout(() => {
            player.dead = false;
            player.invincible = 120;
            player.submerged = false;
            player.inWater = false;
            if (deathInWater) {
                // 在水中死亡：原地复活
                const waterGroundY = Math.floor(H / TILE) - 2;
                player.x = deathX;
                player.y = waterGroundY * TILE - player.h / 2;
            } else if (deathOnGround) {
                // 在陆地死亡：原地复活
                player.x = deathX;
                player.y = findSafeRespawn(deathX).y;
            } else {
                // 在空中死亡：找左侧最近陆地复活
                const safe = findSafeRespawn(deathX);
                player.x = safe.x;
                player.y = safe.y;
            }
            player.vy = 0;
            player.vx = 0;
        }, 800);
    }
}

// ========== 绘制函数 ==========
function drawBackground(camX) {
    const now = Date.now();

    // ===== 更新暴风雨状态 =====
    // 闪电计时
    stormTimer--;
    if (stormTimer <= 0) {
        lightningFlash = 1;
        const bx = 100 + Math.random() * (W - 200);
        lightningBolts = generateLightningBolt(bx, 20, H * 0.7);
        stormTimer = 180 + Math.random() * 400;
        screenShake = Math.max(screenShake, 6);
    }
    if (lightningFlash > 0) lightningFlash *= 0.88;
    if (lightningFlash < 0.01) { lightningFlash = 0; lightningBolts = []; }

    // 雨滴更新
    for (const r of raindrops) {
        r.x += 2.5;
        r.y += r.speed;
        if (r.y > H) { r.y = -r.len; r.x = Math.random() * (W + 200) - 100; }
        if (r.x > W + 50) r.x = -50;
    }

    // ===== 漆黑夜空 =====
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#020208');
    skyGrad.addColorStop(0.4, '#050510');
    skyGrad.addColorStop(1, '#0a0a15');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // ===== 星星（只在云缝中可见）=====
    // 先绘制星星到一个临时区域，然后被云覆盖
    for (let i = 0; i < 120; i++) {
        const sx = ((i * 137 + i * i * 17) % 3000 - camX * 0.15) % (W + 100);
        const sy = (i * 73 + i * 31) % (H * 0.55);
        // 检查是否被云遮挡
        let blocked = false;
        for (const c of stormClouds) {
            const cx = ((c.x - camX * (0.1 + c.layer * 0.15)) % (W + c.w + 200)) - 100;
            const dx = sx - (cx + c.w / 2);
            const dy = sy - (c.y + c.h / 2);
            if (Math.abs(dx) < c.w * 0.6 && Math.abs(dy) < c.h * 0.8) {
                blocked = true; break;
            }
        }
        if (!blocked) {
            const twinkle = 0.4 + (Math.sin(now * 0.002 + i * 3.7) + 1) * 0.3;
            const flashBoost = lightningFlash * 0.5;
            ctx.globalAlpha = Math.min(1, twinkle + flashBoost);
            ctx.fillStyle = i % 5 === 0 ? '#ffe8c0' : '#ffffff';
            const sz = (i % 4 === 0) ? 2 : 1;
            ctx.fillRect(sx, sy, sz, sz);
        }
    }
    ctx.globalAlpha = 1;

    // ===== 云层（3层，由远到近）=====
    for (const c of stormClouds) {
        const parallax = 0.1 + c.layer * 0.15;
        let cx = (c.x - camX * parallax) % (W + c.w + 200);
        if (cx < -c.w - 100) cx += W + c.w + 200;
        cx -= 100;

        const dark = c.darkness + lightningFlash * 0.3;
        const baseR = Math.floor(18 + c.layer * 5);
        const baseG = Math.floor(18 + c.layer * 4);
        const baseB = Math.floor(28 + c.layer * 6);

        // 云主体（多层椭圆叠加）
        for (let l = 0; l < 4; l++) {
            const ox = (l - 1.5) * c.w * 0.22;
            const oy = (l % 2 === 0 ? -1 : 1) * c.h * 0.15;
            const rw = c.w * (0.5 + l * 0.08);
            const rh = c.h * (0.6 + (l % 2) * 0.2);

            const cloudGrad = ctx.createRadialGradient(
                cx + ox, c.y + oy, 0,
                cx + ox, c.y + oy, rw * 0.7
            );
            const r = Math.floor(baseR * (1 - dark * 0.5) + lightningFlash * 40);
            const g = Math.floor(baseG * (1 - dark * 0.5) + lightningFlash * 35);
            const b = Math.floor(baseB * (1 - dark * 0.3) + lightningFlash * 50);
            cloudGrad.addColorStop(0, `rgba(${r},${g},${b},${0.85 - l * 0.05})`);
            cloudGrad.addColorStop(0.6, `rgba(${Math.floor(r*0.6)},${Math.floor(g*0.6)},${Math.floor(b*0.7)},${0.7 - l * 0.05})`);
            cloudGrad.addColorStop(1, `rgba(${Math.floor(r*0.3)},${Math.floor(g*0.3)},${Math.floor(b*0.4)},0)`);

            ctx.fillStyle = cloudGrad;
            ctx.beginPath();
            ctx.ellipse(cx + ox, c.y + oy, rw, rh, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 云底暗部（体积感）
        ctx.fillStyle = `rgba(5,5,12,${0.3 + c.layer * 0.05})`;
        ctx.beginPath();
        ctx.ellipse(cx, c.y + c.h * 0.3, c.w * 0.45, c.h * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();

        // 云顶亮边（被闪电照亮时）
        if (lightningFlash > 0.05) {
            ctx.fillStyle = `rgba(200,210,255,${lightningFlash * 0.25})`;
            ctx.beginPath();
            ctx.ellipse(cx, c.y - c.h * 0.15, c.w * 0.4, c.h * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ===== 闪电 =====
    if (lightningBolts.length > 0 && lightningFlash > 0.02) {
        // 闪电照亮天空
        ctx.fillStyle = `rgba(180,190,255,${lightningFlash * 0.15})`;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        for (const seg of lightningBolts) {
            const alpha = lightningFlash * (seg.branch ? 0.5 : 1);
            const width = seg.branch ? 1 : 2 + lightningFlash * 2;
            // 外层光晕
            ctx.strokeStyle = `rgba(150,170,255,${alpha * 0.3})`;
            ctx.lineWidth = width + 6;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
            // 中层
            ctx.strokeStyle = `rgba(200,210,255,${alpha * 0.6})`;
            ctx.lineWidth = width + 2;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
            // 核心
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
        }
        ctx.restore();
    }

    // ===== 大雨 =====
    ctx.save();
    for (const r of raindrops) {
        const flashBoost = lightningFlash * 0.4;
        ctx.globalAlpha = Math.min(1, r.alpha + flashBoost);
        ctx.strokeStyle = lightningFlash > 0.3 ? 'rgba(200,210,255,0.7)' : 'rgba(150,160,200,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x + 3, r.y + r.len);
        ctx.stroke();
    }
    ctx.restore();

    // ===== 远山（多层杂乱剪影）=====
    // 最远层 - 深暗紫蓝
    const mtnAlpha1 = 0.25 + lightningFlash * 0.3;
    ctx.fillStyle = `rgba(12,8,22,${mtnAlpha1})`;
    for (let x = 0; x < W; x += 2) {
        const wx = x + camX * 0.08;
        const h = 100
            + Math.sin(wx * 0.003) * 60
            + Math.sin(wx * 0.007 + 2.1) * 35
            + Math.sin(wx * 0.019 + 5.3) * 15
            + (Math.sin(wx * 0.001) > 0.6 ? 40 : 0); // 偶尔高峰
        ctx.fillRect(x, H - h - 40, 2, h + 40);
    }
    // 中间层 - 深灰褐
    const mtnAlpha2 = 0.35 + lightningFlash * 0.35;
    ctx.fillStyle = `rgba(14,10,18,${mtnAlpha2})`;
    for (let x = 0; x < W; x += 2) {
        const wx = x + camX * 0.18;
        const h = 70
            + Math.sin(wx * 0.005 + 1.7) * 45
            + Math.sin(wx * 0.013 + 3.9) * 25
            + Math.sin(wx * 0.031 + 0.7) * 10
            + (Math.sin(wx * 0.002 + 4.0) > 0.7 ? 30 : 0);
        ctx.fillRect(x, H - h - 50, 2, h + 50);
    }
    // 最近层 - 深黑绿
    const mtnAlpha3 = 0.45 + lightningFlash * 0.4;
    ctx.fillStyle = `rgba(6,10,8,${mtnAlpha3})`;
    for (let x = 0; x < W; x += 2) {
        const wx = x + camX * 0.35;
        const h = 50
            + Math.sin(wx * 0.009 + 0.3) * 30
            + Math.sin(wx * 0.023 + 2.8) * 18
            + Math.sin(wx * 0.047 + 6.1) * 8;
        ctx.fillRect(x, H - h - 60, 2, h + 60);
    }

    // ===== 杂乱树木/植被剪影 =====
    for (let x = 0; x < W; x += 2) {
        const wx = x + camX * 0.55;
        // 用多个不同频率的sin叠加制造不规则感
        const density = Math.sin(wx * 0.03) + Math.sin(wx * 0.071 + 1.3) + Math.sin(wx * 0.137 + 3.7);
        if (density > 0.3) {
            const treeH = 20 + Math.abs(Math.sin(wx * 0.017 + 2.1)) * 55
                + Math.abs(Math.sin(wx * 0.043 + 5.5)) * 20;
            const baseY = H - 90;
            const trunkW = 2 + (Math.sin(wx * 0.09) > 0.5 ? 1 : 0);
            // 树干
            const trunkAlpha = 0.35 + lightningFlash * 0.5;
            ctx.fillStyle = `rgba(4,8,4,${trunkAlpha})`;
            ctx.fillRect(x, baseY - treeH, trunkW, treeH);
            // 树冠（不规则）
            const crownAlpha = 0.3 + lightningFlash * 0.4;
            ctx.fillStyle = `rgba(3,6,3,${crownAlpha})`;
            const cw = 8 + Math.abs(Math.sin(wx * 0.06)) * 12;
            const ch = 10 + Math.abs(Math.sin(wx * 0.08)) * 10;
            ctx.beginPath();
            ctx.ellipse(x + trunkW / 2, baseY - treeH - ch * 0.3, cw, ch, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// 绘制单根羽毛
function drawFeather(x1, y1, x2, y2, width, color) {
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    const nx = -dy / len * width;
    const ny = dx / len * width;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx + nx * 1.2, my + ny * 1.2, x2, y2);
    ctx.quadraticCurveTo(mx - nx * 0.3, my - ny * 0.3, x1, y1);
    ctx.fill();
    // 羽毛边缘描边
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // 羽毛中线
    ctx.strokeStyle = 'rgba(200,210,230,0.25)';
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

// 绘制天使翅膀（朝右方向绘制，scale控制大小）
// 翅膀从身体向后延伸（向左），贴合身体轮廓
function drawAngelWings(scale) {
    const t = Date.now() * 0.006;
    const s = scale;

    // 翅膀根部紧贴背部中央
    const rootX = -2;
    const rootY = -4 * s;

    // === 上层翅膀（向左上方大幅展开）===
    // 主飞羽（6根，长而有力）
    const primaries = [
        { angle: 152, len: 42, w: 3.0 },
        { angle: 158, len: 46, w: 3.4 },
        { angle: 164, len: 48, w: 3.6 },
        { angle: 170, len: 46, w: 3.4 },
        { angle: 176, len: 42, w: 3.0 },
        { angle: 182, len: 38, w: 2.8 },
    ];
    primaries.forEach((f, i) => {
        const flap = Math.sin(t + i * 0.12) * 4 * s;
        const a = (f.angle + flap * 0.25) * Math.PI / 180;
        const ex = rootX + Math.cos(a) * f.len * s;
        const ey = rootY + Math.sin(a) * f.len * s;
        drawFeather(rootX, rootY, ex, ey, f.w * s,
            i % 2 === 0 ? 'rgba(255,255,255,0.93)' : 'rgba(238,244,255,0.9)');
    });

    // 次飞羽（5根，中等长度，填充主飞羽间隙）
    const secondaries = [
        { angle: 148, len: 30, w: 2.8 },
        { angle: 154, len: 34, w: 3.0 },
        { angle: 160, len: 36, w: 3.2 },
        { angle: 166, len: 34, w: 3.0 },
        { angle: 172, len: 30, w: 2.8 },
    ];
    secondaries.forEach((f, i) => {
        const flap = Math.sin(t + 0.2 + i * 0.1) * 3.5 * s;
        const a = (f.angle + flap * 0.2) * Math.PI / 180;
        const ex = rootX + Math.cos(a) * f.len * s;
        const ey = rootY + Math.sin(a) * f.len * s;
        drawFeather(rootX, rootY, ex, ey, f.w * s,
            i % 2 === 0 ? 'rgba(242,248,255,0.85)' : 'rgba(255,255,255,0.8)');
    });

    // 上覆羽（7根，短密，贴合身体轮廓）
    for (let i = 0; i < 7; i++) {
        const flap = Math.sin(t + 0.5 + i * 0.08) * 2.5 * s;
        const a = (175 + i * 6 + flap * 0.1) * Math.PI / 180;
        const len = (12 + i * 2) * s;
        const ex = rootX + Math.cos(a) * len;
        const ey = rootY + Math.sin(a) * len;
        drawFeather(rootX + 1 * s, rootY - 1 * s, ex, ey, 2.2 * s,
            'rgba(255,255,255,0.55)');
    }

    // === 下层翅膀（向左下方展开）===
    // 主飞羽（5根）
    const lowerPrimaries = [
        { angle: 195, len: 36, w: 2.8 },
        { angle: 205, len: 40, w: 3.2 },
        { angle: 215, len: 42, w: 3.4 },
        { angle: 225, len: 38, w: 3.0 },
        { angle: 235, len: 32, w: 2.6 },
    ];
    lowerPrimaries.forEach((f, i) => {
        const flap = Math.sin(t + 0.15 + i * 0.11) * 4.5 * s;
        const a = (f.angle + flap * 0.25) * Math.PI / 180;
        const ex = rootX + Math.cos(a) * f.len * s;
        const ey = rootY + Math.sin(a) * f.len * s;
        drawFeather(rootX, rootY, ex, ey, f.w * s,
            i % 2 === 0 ? 'rgba(255,255,255,0.92)' : 'rgba(235,242,255,0.88)');
    });

    // 下覆羽（5根，短密贴合）
    for (let i = 0; i < 5; i++) {
        const flap = Math.sin(t + 0.7 + i * 0.09) * 2.5 * s;
        const a = (188 + i * 10 + flap * 0.1) * Math.PI / 180;
        const len = (10 + i * 2) * s;
        const ex = rootX + Math.cos(a) * len;
        const ey = rootY + Math.sin(a) * len;
        drawFeather(rootX + 1 * s, rootY + 1 * s, ex, ey, 1.8 * s,
            'rgba(255,255,255,0.5)');
    }

    // 翅膀根部柔光
    ctx.save();
    ctx.globalAlpha = 0.1 + Math.sin(t * 1.2) * 0.05;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(rootX - 6 * s, rootY, 10 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawLevel(camX) {
    const startTile = Math.floor(camX / TILE);
    const endTile = startTile + Math.ceil(W / TILE) + 1;

    // 第一遍：绘制地面和平台（跳过水）
    for (let y = 0; y < level.length; y++) {
        for (let x = startTile; x < endTile && x < level[0].length; x++) {
            const tile = level[y][x];
            const px = x * TILE - camX;
            const py = y * TILE;

            if (tile === 1) {
                // 地面（泥泞泥土）
                const isTop = y > 0 && !isSolid(level[y-1][x]);
                if (isTop) {
                    ctx.fillStyle = '#2e2015';
                    ctx.fillRect(px, py, TILE, 4);
                    ctx.fillStyle = '#3a2a18';
                    ctx.fillRect(px, py + 4, TILE, 4);
                    ctx.fillStyle = '#281c10';
                    ctx.fillRect(px, py + 8, TILE, TILE - 8);
                    ctx.fillStyle = '#1e1508';
                    ctx.fillRect(px + 2, py + 2, 3, 2);
                    ctx.fillRect(px + 14, py + 5, 4, 2);
                    ctx.fillRect(px + 8, py + 1, 2, 3);
                    if ((x + y) % 3 === 0) {
                        ctx.fillStyle = '#2a2a10';
                        ctx.fillRect(px + 5, py - 2, 1, 4);
                        ctx.fillRect(px + 18, py - 3, 1, 5);
                    }
                    if ((x * 7 + y * 13) % 5 === 0) {
                        ctx.fillStyle = 'rgba(60,50,40,0.3)';
                        ctx.fillRect(px + 3, py + 1, 6, 2);
                    }
                } else {
                    ctx.fillStyle = '#221608';
                    ctx.fillRect(px, py, TILE, TILE);
                    ctx.fillStyle = '#1a1008';
                    ctx.fillRect(px + 2, py + 2, 5, 4);
                    ctx.fillRect(px + 14, py + 8, 6, 5);
                    ctx.fillRect(px + 8, py + 18, 4, 6);
                    ctx.fillStyle = '#2a2218';
                    ctx.fillRect(px + 20, py + 4, 3, 3);
                    ctx.fillRect(px + 6, py + 24, 4, 3);
                }
                ctx.strokeStyle = '#1a1008';
                ctx.lineWidth = 1;
                ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
            } else if (tile === 2) {
                ctx.fillStyle = '#4a3a22';
                ctx.fillRect(px, py, TILE, 8);
                ctx.fillStyle = '#3a2a18';
                ctx.fillRect(px, py + 8, TILE, 4);
                ctx.fillStyle = '#5a4a2a';
                ctx.fillRect(px + 2, py + 2, 4, 2);
                ctx.fillRect(px + 14, py + 2, 6, 2);
            }
        }
    }

    // 水路段背景：低矮灌木丛 + 树木（在水面之下绘制）
    const treeSpots2 = [110, 120, 132, 144, 156];
    const waterGroundY2 = Math.floor(H / TILE) - 2;
    const bushGroundPx = waterGroundY2 * TILE;

    // 低矮灌木丛（覆盖水路段底部，极暗色）
    for (let x = 105; x < 158; x++) {
        const bpx = x * TILE - camX;
        if (bpx < -TILE || bpx > W + TILE) continue;
        const seed2 = x * 17;
        // 灌木丛 - 不规则的低矮暗色植被
        ctx.fillStyle = '#040804';
        ctx.beginPath();
        ctx.ellipse(bpx + 16, bushGroundPx - 6, 20 + (seed2 % 8), 10 + (seed2 % 5), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#060906';
        ctx.beginPath();
        ctx.ellipse(bpx + 8, bushGroundPx - 4, 14 + (seed2 % 6), 8 + (seed2 % 4), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bpx + 24, bushGroundPx - 5, 12 + (seed2 % 5), 7 + (seed2 % 3), 0, 0, Math.PI * 2);
        ctx.fill();
        // 灌木丛上的黑点
        ctx.fillStyle = '#020402';
        for (let j = 0; j < 4; j++) {
            const bx = ((seed2 + j * 31) % 28);
            const by = ((seed2 + j * 19) % 8);
            ctx.beginPath();
            ctx.arc(bpx + bx, bushGroundPx - 4 - by, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 树木（树根隐藏在灌木丛中不可见）
    treeSpots2.forEach(tx => {
        const treePx = tx * TILE - camX;
        if (treePx < -200 || treePx > W + 200) return;
        const seed = tx * 31;
        const treeH = 400 + (seed % 80);

        // 树干（从灌木丛顶部开始，不画到地面）
        const trunkW = 40 + (seed % 16);
        const trunkX = treePx + 64 - trunkW / 2;
        const trunkStartY = bushGroundPx - 12; // 从灌木丛中开始
        ctx.fillStyle = '#0d0803';
        ctx.fillRect(trunkX, trunkStartY - treeH + 12, trunkW, treeH - 12);
        ctx.fillStyle = '#110a04';
        ctx.fillRect(trunkX + 4, trunkStartY - treeH + 12, trunkW - 12, treeH - 12);
        ctx.fillStyle = '#080502';
        ctx.fillRect(trunkX + trunkW - 8, trunkStartY - treeH + 12, 8, treeH - 12);
        // 树干黑点
        ctx.fillStyle = '#050302';
        for (let i = 0; i < 40; i++) {
            const dx = ((seed + i * 41) % (trunkW - 8));
            const dy = ((seed + i * 67) % (treeH - 50)) + 25;
            ctx.fillRect(trunkX + dx, trunkStartY - dy, 3 + ((seed + i * 13) % 5), 3 + ((seed + i * 23) % 6));
        }

        // 树枝
        ctx.strokeStyle = '#0d0803';
        ctx.lineWidth = 6;
        const branchBase = trunkStartY - treeH + 12;
        ctx.beginPath();
        ctx.moveTo(trunkX + trunkW / 2, branchBase + treeH * 0.5);
        ctx.lineTo(trunkX - 50, branchBase + treeH * 0.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(trunkX + trunkW / 2, branchBase + treeH * 0.4);
        ctx.lineTo(trunkX + trunkW + 45, branchBase + treeH * 0.25);
        ctx.stroke();
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(trunkX + trunkW / 2, branchBase + treeH * 0.6);
        ctx.lineTo(trunkX - 35, branchBase + treeH * 0.45);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(trunkX + trunkW / 2, branchBase + treeH * 0.65);
        ctx.lineTo(trunkX + trunkW + 30, branchBase + treeH * 0.52);
        ctx.stroke();

        // 树冠
        const canopyY = branchBase;
        ctx.fillStyle = '#040704';
        ctx.beginPath();
        ctx.ellipse(treePx + 64, canopyY + 40, 100, 75, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#050905';
        ctx.beginPath();
        ctx.ellipse(treePx + 40, canopyY + 25, 75, 60, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(treePx + 88, canopyY + 28, 70, 55, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#060a06';
        ctx.beginPath();
        ctx.ellipse(treePx + 64, canopyY - 10, 65, 50, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#070b07';
        ctx.beginPath();
        ctx.ellipse(treePx + 48, canopyY - 25, 50, 40, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(treePx + 80, canopyY - 20, 45, 36, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#080c08';
        ctx.beginPath();
        ctx.ellipse(treePx + 56, canopyY - 40, 35, 28, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(treePx + 74, canopyY - 36, 30, 24, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // 树冠黑点
        ctx.fillStyle = '#020502';
        for (let i = 0; i < 30; i++) {
            const dx = ((seed + i * 29) % 160) - 80;
            const dy = ((seed + i * 47) % 100) - 30;
            ctx.beginPath();
            ctx.arc(treePx + 64 + dx, canopyY + 20 + dy, 3 + (i % 4), 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // 第二遍：绘制水面（覆盖在树木和灌木丛之上）
    for (let y = 0; y < level.length; y++) {
        for (let x = startTile; x < endTile && x < level[0].length; x++) {
            if (level[y][x] === 3) {
                const px = x * TILE - camX;
                const py = y * TILE;
                ctx.fillStyle = '#0a1e3a';
                ctx.fillRect(px, py, TILE, TILE);
                ctx.fillStyle = '#122a4a';
                const waveOffset = Math.sin((x * 0.5 + Date.now() * 0.005)) * 3;
                ctx.fillRect(px, py + waveOffset, TILE, 4);
            }
        }
    }

    // 移动平台
    for (const mp of movingPlatforms) {
        const px = mp.x - camX;
        const py = mp.y;
        if (px + mp.w < -32 || px > W + 32) continue;
        // 平台主体 - 暗铁色
        ctx.fillStyle = '#3a3530';
        ctx.fillRect(px, py, mp.w, 8);
        ctx.fillStyle = '#2a2520';
        ctx.fillRect(px, py + 8, mp.w, 4);
        // 铆钉
        ctx.fillStyle = '#4a4540';
        ctx.fillRect(px + 3, py + 2, 3, 3);
        ctx.fillRect(px + mp.w - 6, py + 2, 3, 3);
        // 边框
        ctx.strokeStyle = '#1a1510';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, mp.w - 1, 11);
        // 底部链条/绳索效果
        ctx.fillStyle = '#252015';
        for (let cx = px + 8; cx < px + mp.w - 4; cx += 12) {
            ctx.fillRect(cx, py + 12, 2, 4);
        }
    }
}

function drawPlayer(camX) {
    if (player.dead) return;
    if (player.invincible > 0 && player.invincible % 4 < 2) return;

    const px = player.x - camX;
    const py = player.y;
    const facing = player.dir;
    const isCurled = !easyMode && !player.onGround && (player.jumping || player.vy !== 0);

    // 完全潜入水中时完全不可见（只有水面波纹显示位置）
    if (player.submerged) {
        return;
    }

    // 半身在水中：裁剪掉水中部分
    if (player.inWater) {
        const waterGroundY = Math.floor(H / TILE) - 2;
        const waterSurfaceY = waterGroundY * TILE;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, waterSurfaceY);
        ctx.clip();
    }

    if (player.ducking) {
        // === 趴下：水平绘制，宽36 高10 ===
        const bodyBottom = py + player.h; // 脚底位置
        const proneTop = bodyBottom - 10;
        const groundY = bodyBottom - 2; // 贴地位置

        ctx.save();
        // 简单模式天使翅膀（趴下时）
        if (easyMode) {
            const wingCenterY = proneTop + 5;
            if (facing > 0) {
                ctx.save();
                ctx.translate(px + 4, wingCenterY);
                ctx.scale(0.6, 0.6);
                drawAngelWings(1);
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(px + 20, wingCenterY);
                ctx.scale(-0.6, 0.6);
                drawAngelWings(1);
                ctx.restore();
            }
        }
        if (facing > 0) {
            // 身体
            ctx.fillStyle = '#4488ff';
            ctx.fillRect(px - 8, proneTop + 1, 32, 8);
            // 头
            ctx.fillStyle = '#ffcc88';
            ctx.fillRect(px + 22, proneTop + 1, 10, 8);
            // 头盔
            ctx.fillStyle = '#4466aa';
            ctx.fillRect(px + 22, proneTop, 12, 4);
            // 脚（在身后）
            ctx.fillStyle = '#3366cc';
            ctx.fillRect(px - 12, proneTop + 2, 6, 7);
            ctx.fillRect(px - 5, proneTop + 2, 6, 7);
            // 枪（贴着地面）
            ctx.save();
            ctx.translate(px + 20, groundY);
            let gunAngle = 0;
            if (player.aimDiag) gunAngle = -Math.PI / 4;
            else if (player.aimingUp) gunAngle = -Math.PI / 2;
            ctx.rotate(gunAngle);
            ctx.fillStyle = '#888';
            ctx.fillRect(0, -2, 16, 4);
            ctx.restore();
        } else {
            // 身体
            ctx.fillStyle = '#4488ff';
            ctx.fillRect(px - 4, proneTop + 1, 32, 8);
            // 头（朝左，头在左端）
            ctx.fillStyle = '#ffcc88';
            ctx.fillRect(px - 14, proneTop + 1, 10, 8);
            // 头盔
            ctx.fillStyle = '#4466aa';
            ctx.fillRect(px - 16, proneTop, 12, 4);
            // 脚（在身后）
            ctx.fillStyle = '#3366cc';
            ctx.fillRect(px + 26, proneTop + 2, 6, 7);
            ctx.fillRect(px + 33, proneTop + 2, 6, 7);
            // 枪（贴着地面）
            ctx.save();
            ctx.translate(px - 12, groundY);
            let gunAngle = Math.PI;
            if (player.aimDiag) gunAngle = -Math.PI * 3 / 4;
            else if (player.aimingUp) gunAngle = -Math.PI / 2;
            ctx.rotate(gunAngle);
            ctx.fillStyle = '#888';
            ctx.fillRect(0, -2, 16, 4);
            ctx.restore();
        }
        ctx.restore();
    } else if (isCurled) {
        // === 空中翻滚 - 缩成一团 ===
        ctx.save();
        ctx.translate(px + player.w/2, py + player.h/2);
        if (facing < 0) ctx.scale(-1, 1);
        // 简单模式天使翅膀
        if (easyMode) drawAngelWings(0.8);
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffcc88';
        ctx.beginPath();
        ctx.arc(0, -4, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4466aa';
        ctx.fillRect(-8, -12, 16, 6);
        ctx.strokeStyle = '#3366cc';
        ctx.lineWidth = 2;
        const rollAngle = player.animFrame * Math.PI / 3;
        ctx.beginPath();
        ctx.arc(0, 0, 14, rollAngle, rollAngle + Math.PI / 2);
        ctx.stroke();
        ctx.restore();
    } else {
        // === 站立 ===
        const bodyH = player.h;
        ctx.save();
        ctx.translate(px + player.w/2, py + player.h/2);
        if (facing < 0) ctx.scale(-1, 1);

        // 简单模式天使翅膀
        if (easyMode) drawAngelWings(1);

        // 身体
        ctx.fillStyle = '#4488ff';
        ctx.fillRect(-8, -bodyH/2 + 4, 16, bodyH - 8);
        // 头
        ctx.fillStyle = '#ffcc88';
        ctx.fillRect(-6, -bodyH/2 - 4, 12, 10);
        // 头盔
        ctx.fillStyle = '#4466aa';
        ctx.fillRect(-7, -bodyH/2 - 6, 14, 6);
        // 腿
        ctx.fillStyle = '#3366cc';
        if (Math.abs(player.vx) > 0.5) {
            const legOffset = Math.sin(player.animFrame * Math.PI / 2) * 4;
            ctx.fillRect(-5, bodyH/2 - 6, 4, 8 + legOffset);
            ctx.fillRect(1, bodyH/2 - 6, 4, 8 - legOffset);
        } else {
            ctx.fillRect(-5, bodyH/2 - 6, 4, 8);
            ctx.fillRect(1, bodyH/2 - 6, 4, 8);
        }

        // 枪
        ctx.fillStyle = '#888';
        ctx.save();
        ctx.translate(2, -bodyH/2 + 6);
        let gunAngle = 0;
        if (player.aimDiag) gunAngle = -Math.PI / 4;
        else if (player.aimingUp) gunAngle = -Math.PI / 2;
        else if (player.aimDiagDown) gunAngle = Math.PI / 4;
        else if (player.aimDown) gunAngle = Math.PI / 2;
        ctx.rotate(gunAngle);
        ctx.fillRect(0, -2, 16, 4);
        ctx.restore();

        ctx.restore();
    }

    // 恢复水中裁剪
    if (player.inWater && !player.submerged) {
        ctx.restore();
    }
}

function drawBullets(camX) {
    // 玩家子弹
    bullets.forEach(b => {
        const px = b.x - camX;
        if (b.weaponType === 'spiral') {
            // F型：弹簧状波形弹，带尾迹
            const angle = b.baseAngle || Math.atan2(b.vy, b.vx);
            const perpX = -Math.sin(angle);
            const perpY = Math.cos(angle);
            // 绘制弹簧尾迹
            ctx.strokeStyle = '#f0f';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            const trailLen = Math.min((b.time || 0), 20);
            for (let t = 0; t <= trailLen; t++) {
                const trailT = trailLen - t;
                const baseX = b.x - b.vx * t;
                const baseY = b.y - b.vy * t;
                const wave = Math.min(trailT * 0.15, 1) * 6 * Math.sin(trailT * 0.4);
                const tx = baseX + perpX * wave;
                const ty = baseY + perpY * wave;
                if (t === 0) ctx.moveTo(tx - camX, ty);
                else ctx.lineTo(tx - camX, ty);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            // 核心能量球
            ctx.fillStyle = '#f0f';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#faf';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w / 2 - 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, b.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (b.weaponType === 'lightning') {
            // T型：树枝状闪电，用预生成的线段绘制
            const fadeAlpha = b.life / 8;
            ctx.lineCap = 'round';
            // 外层光晕
            ctx.strokeStyle = '#4488ff';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.25 * fadeAlpha;
            ctx.beginPath();
            for (const s of b.segments) {
                ctx.moveTo(s.x1 - camX, s.y1);
                ctx.lineTo(s.x2 - camX, s.y2);
            }
            ctx.stroke();
            // 主体
            ctx.strokeStyle = '#88ccff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7 * fadeAlpha;
            ctx.beginPath();
            for (const s of b.segments) {
                ctx.moveTo(s.x1 - camX, s.y1);
                ctx.lineTo(s.x2 - camX, s.y2);
            }
            ctx.stroke();
            // 核心
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.globalAlpha = fadeAlpha;
            ctx.beginPath();
            for (const s of b.segments) {
                ctx.moveTo(s.x1 - camX, s.y1);
                ctx.lineTo(s.x2 - camX, s.y2);
            }
            ctx.stroke();
            // 起点闪光
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = fadeAlpha;
            ctx.beginPath();
            ctx.arc(b.x - camX, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineCap = 'butt';
            ctx.globalAlpha = 1;
        } else if (b.weaponType === 'homing') {
            // K型：小导弹形状
            ctx.save();
            ctx.translate(px, b.y);
            const mAngle = Math.atan2(b.vy, b.vx);
            ctx.rotate(mAngle);
            // 弹体
            ctx.fillStyle = '#888';
            ctx.fillRect(-6, -3, 12, 6);
            // 弹头
            ctx.fillStyle = '#f44';
            ctx.fillRect(4, -3, 4, 6);
            // 尾焰
            ctx.fillStyle = '#f80';
            ctx.fillRect(-8, -2, 3, 4);
            ctx.fillStyle = '#ff0';
            ctx.fillRect(-7, -1, 2, 2);
            ctx.restore();
        } else {
            // 普通/R型/S型子弹
            ctx.fillStyle = '#ff0';
            ctx.fillRect(px - b.w/2, b.y - b.h/2, b.w, b.h);
            ctx.fillStyle = '#fff';
            ctx.fillRect(px - 1, b.y - 1, 2, 2);
        }
    });

    // 敌人子弹
    enemyBullets.forEach(b => {
        const px = b.x - camX;
        if (b.type === 'fire') {
            // 火焰弹 - 橙红色，渐变效果
            ctx.fillStyle = '#f60';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/3, 0, Math.PI * 2);
            ctx.fill();
        } else if (b.type === 'lightning') {
            // 闪电弹 - 蓝白色闪光
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/4, 0, Math.PI * 2);
            ctx.fill();
        } else if (b.type === 'heavy') {
            // 重弹 - 大红色
            ctx.fillStyle = '#c00';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f44';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/3, 0, Math.PI * 2);
            ctx.fill();
        } else if (b.type === 'slow') {
            // 空降兵慢速子弹 - 暗绿色
            ctx.fillStyle = '#6a6';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#8c8';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/4, 0, Math.PI * 2);
            ctx.fill();
        } else if (b.type === 'torpedo') {
            // 鱼雷 - 椭圆形金属体
            const tx = px, ty = b.y;
            const dir = b.vx > 0 ? 1 : -1;
            ctx.save();
            ctx.translate(tx, ty);
            ctx.scale(dir, 1);
            // 弹体
            ctx.fillStyle = '#4a5a6a';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            // 弹头
            ctx.fillStyle = '#c33';
            ctx.beginPath();
            ctx.moveTo(12, 0);
            ctx.lineTo(16, -2);
            ctx.lineTo(16, 2);
            ctx.closePath();
            ctx.fill();
            // 尾翼
            ctx.fillStyle = '#3a4a5a';
            ctx.fillRect(-14, -5, 4, 10);
            // 高光
            ctx.fillStyle = '#8a9aaa';
            ctx.globalAlpha = 0.5;
            ctx.fillRect(-6, -2, 10, 2);
            ctx.globalAlpha = 1;
            // 尾焰
            ctx.fillStyle = '#f80';
            ctx.globalAlpha = 0.6 + Math.sin(b.life * 0.3) * 0.3;
            ctx.beginPath();
            ctx.ellipse(-16, 0, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        } else if (b.special) {
            // 炮台特殊子弹 - 更大、橙红色带发光
            ctx.fillStyle = '#f80';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#f44';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f88';
            ctx.beginPath();
            ctx.arc(px, b.y, b.w/4, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawEnemies(camX) {
    enemies.forEach(e => {
        if (!e.alive || !e.active) return;

        const px = e.x - camX;
        const py = e.y;

        // 树冠敌人：不攻击时只见阴影头部，攻击时探出半边身子
        if (e.inTree) {
            const waterGroundY = Math.floor(H / TILE) - 2;
            const actualCanopyY = waterGroundY * TILE - e.treeH;
            if (e.peeking) {
                // 探出半边身子 - 可被击中，位置与碰撞体积一致
                ctx.fillStyle = '#ccaa88';
                ctx.fillRect(e.x - camX + 4, actualCanopyY + 20, 12, 10);
                ctx.fillStyle = '#4a5a33';
                ctx.fillRect(e.x - camX + 5, actualCanopyY + 17, 14, 5);
                ctx.fillStyle = '#776644';
                ctx.fillRect(e.x - camX + 2, actualCanopyY + 30, 16, 14);
                // 枪
                const gunAngle = Math.atan2(player.y - e.y, player.x - e.x);
                ctx.save();
                ctx.translate(e.x - camX + 12, actualCanopyY + 36);
                ctx.rotate(gunAngle);
                ctx.fillStyle = '#555';
                ctx.fillRect(0, -2, 12, 4);
                ctx.restore();
            } else {
                // 隐藏在树冠中 - 只露出有阴影的头，与树冠颜色接近
                ctx.fillStyle = 'rgba(50,35,20,0.8)';
                ctx.fillRect(e.x - camX + 6, actualCanopyY + 22, 10, 8);
                ctx.fillStyle = 'rgba(30,20,10,0.8)';
                ctx.fillRect(e.x - camX + 5, actualCanopyY + 20, 12, 4);
            }
            return;
        }

        if (e.type === 'turret') {
            // 炮台
            ctx.fillStyle = '#884422';
            ctx.fillRect(px, py + 8, e.w, e.h - 8);
            ctx.fillStyle = '#aa5533';
            ctx.fillRect(px + 4, py + 4, e.w - 8, e.h - 12);
            // 炮管
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            ctx.save();
            ctx.translate(px + e.w/2, py + e.h/2);
            ctx.rotate(angle);
            ctx.fillStyle = '#666';
            ctx.fillRect(0, -3, 20, 6);
            ctx.restore();
            // 闪光
            ctx.fillStyle = '#ff0';
            ctx.fillRect(px + 10, py + 12, 4, 4);
        } else {
            // 人形敌人
            let col = '#886644';
            if (e.type === 'runner') col = '#cc4444';
            else if (e.type === 'flamer') col = '#cc6622';
            else if (e.type === 'lightning') col = '#4488cc';
            else if (e.type === 'heavy') col = '#666666';
            else if (e.type === 'paratrooper') col = '#668844';

            // 水中敌人：裁剪掉水中部分（下半身淹没）
            if (e.inWater) {
                const waterSurfY = (Math.floor(H / TILE) - 2) * TILE;
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, waterSurfY);
                ctx.clip();
            }

            // 空降兵降落伞
            if (e.type === 'paratrooper' && e.parachuting) {
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.arc(px + e.w/2, py - 10, 18, Math.PI, 0);
                ctx.fill();
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px + 4, py);
                ctx.lineTo(px + e.w/2, py - 10);
                ctx.moveTo(px + e.w - 4, py);
                ctx.lineTo(px + e.w/2, py - 10);
                ctx.stroke();
            }

            // 身体
            ctx.fillStyle = col;
            if (e.type === 'heavy') {
                ctx.fillRect(px + 2, py + 12, 28, 24);
            } else {
                ctx.fillRect(px + 4, py + 10, 16, 16);
            }
            // 头
            ctx.fillStyle = '#ddaa77';
            if (e.type === 'heavy') {
                ctx.fillRect(px + 8, py, 16, 14);
            } else {
                ctx.fillRect(px + 6, py, 12, 12);
            }
            // 帽子/头盔
            if (e.type === 'runner') {
                ctx.fillStyle = '#aa2222';
                ctx.fillRect(px + 5, py - 3, 14, 5);
            } else if (e.type === 'heavy') {
                ctx.fillStyle = '#555';
                ctx.fillRect(px + 6, py - 4, 20, 6);
            } else if (e.type === 'flamer') {
                ctx.fillStyle = '#aa4400';
                ctx.fillRect(px + 5, py - 3, 14, 5);
            } else if (e.type === 'lightning') {
                ctx.fillStyle = '#336699';
                ctx.fillRect(px + 5, py - 3, 14, 5);
            } else {
                ctx.fillStyle = '#556633';
                ctx.fillRect(px + 5, py - 3, 14, 5);
            }
            // 腿
            ctx.fillStyle = '#444';
            if (!e.onGround) {
                // 跳跃时腿收起（不是翻滚）
                if (e.type === 'heavy') {
                    ctx.fillRect(px + 8, py + 34, 6, 8);
                    ctx.fillRect(px + 18, py + 34, 6, 8);
                } else {
                    ctx.fillRect(px + 7, py + 24, 4, 6);
                    ctx.fillRect(px + 13, py + 24, 4, 6);
                }
            } else if (e.type === 'heavy') {
                ctx.fillRect(px + 6, py + 36, 6, 12);
                ctx.fillRect(px + 20, py + 36, 6, 12);
            } else if (e.type === 'runner') {
                const legOff = Math.sin(e.animFrame * Math.PI / 2) * 5;
                ctx.fillRect(px + 6, py + 26, 4, 10 + legOff);
                ctx.fillRect(px + 14, py + 26, 4, 10 - legOff);
            } else {
                ctx.fillRect(px + 6, py + 26, 4, 10);
                ctx.fillRect(px + 14, py + 26, 4, 10);
            }
            // 武器 - 枪管朝向玩家（与子弹方向一致）
            const gunAngle = Math.atan2(player.y - e.y, player.x - e.x);
            if (e.type === 'flamer') {
                // 喷火器
                ctx.save();
                ctx.translate(px + 12, py + 16);
                ctx.rotate(gunAngle);
                ctx.fillStyle = '#888';
                ctx.fillRect(0, -3, 14, 6);
                ctx.fillStyle = '#f60';
                ctx.fillRect(13, -2, 5, 4);
                ctx.restore();
            } else if (e.type === 'lightning') {
                // 闪电枪
                ctx.save();
                ctx.translate(px + 12, py + 14);
                ctx.rotate(gunAngle);
                ctx.fillStyle = '#66aaff';
                ctx.fillRect(0, -2, 12, 4);
                ctx.fillStyle = '#0ff';
                ctx.fillRect(11, -1, 6, 2);
                ctx.restore();
            } else if (e.type === 'heavy') {
                // 重机枪
                ctx.save();
                ctx.translate(px + 16, py + 20);
                ctx.rotate(gunAngle);
                ctx.fillStyle = '#555';
                ctx.fillRect(0, -3, 16, 6);
                ctx.restore();
            } else {
                // 普通枪
                ctx.save();
                ctx.translate(px + 12, py + 16);
                ctx.rotate(gunAngle);
                ctx.fillStyle = '#666';
                ctx.fillRect(0, -2, 12, 4);
                ctx.restore();
            }
            // 血条（多血量敌人）
            if (e.maxHp > 1) {
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = '#333';
                ctx.fillRect(px, py - 8, e.w, 4);
                ctx.fillStyle = hpPct > 0.5 ? '#0f0' : hpPct > 0.25 ? '#ff0' : '#f00';
                ctx.fillRect(px, py - 8, e.w * hpPct, 4);
            }
            // 恢复水中裁剪
            if (e.inWater) ctx.restore();
        }
    });
}

function drawBoss(camX) {
    if (!boss || !boss.alive) return;

    const px = boss.x - camX;
    const py = boss.y;

    // 主体
    ctx.fillStyle = '#666';
    ctx.fillRect(px, py, boss.w, boss.h);
    ctx.fillStyle = '#888';
    ctx.fillRect(px + 8, py + 8, boss.w - 16, boss.h - 16);

    // 装甲板
    ctx.fillStyle = '#555';
    ctx.fillRect(px + 4, py + 4, 12, boss.h - 8);
    ctx.fillRect(px + boss.w - 16, py + 4, 12, boss.h - 8);

    // 眼睛
    const eyePhase = Math.sin(boss.animTimer * 0.1);
    ctx.fillStyle = eyePhase > 0 ? '#f00' : '#800';
    ctx.fillRect(px + boss.w/2 - 8, py + 20, 16, 12);
    ctx.fillStyle = '#ff0';
    ctx.fillRect(px + boss.w/2 - 4, py + 24, 8, 4);

    // 炮管
    ctx.fillStyle = '#444';
    ctx.fillRect(px - 20, py + 30, 24, 8);
    ctx.fillRect(px + boss.w - 4, py + 30, 24, 8);
    ctx.fillRect(px + boss.w/2 - 4, py - 16, 8, 20);

    // 血条
    const hpPct = boss.hp / boss.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(px, py - 20, boss.w, 8);
    ctx.fillStyle = hpPct > 0.5 ? '#0f0' : hpPct > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(px, py - 20, boss.w * hpPct, 8);
}

function drawPowerups(camX) {
    powerups.forEach(p => {
        const px = p.x - camX;
        const bob = Math.sin(Date.now() * 0.005) * 3;

        // 发光效果
        ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.01) * 0.2;
        ctx.fillStyle = p.type === 'spread' ? '#f80' : p.type === 'rapid' ? '#0ff' : p.type === 'spiral' ? '#f0f' : p.type === 'lightning' ? '#0af' : p.type === 'homing' ? '#f44' : '#f0f';
        ctx.fillRect(px - 2, p.y + bob - 2, p.w + 4, p.h + 4);
        ctx.globalAlpha = 1;

        // 箱子
        ctx.fillStyle = '#aa8844';
        ctx.fillRect(px, p.y + bob, p.w, p.h);
        ctx.fillStyle = '#ccaa66';
        ctx.fillRect(px + 2, p.y + bob + 2, p.w - 4, p.h - 4);

        // 字母
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        const letter = p.type === 'spread' ? 'S' : p.type === 'rapid' ? 'R' : p.type === 'spiral' ? 'F' : p.type === 'lightning' ? 'T' : p.type === 'homing' ? 'K' : '♥';
        ctx.fillText(letter, px + p.w/2, p.y + bob + 17);
    });
}

function drawHUD() {
    // 分数
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 24);

    // 最高分
    ctx.textAlign = 'center';
    ctx.fillText(`HI: ${Math.max(score, hiScore)}`, W/2, 24);

    // 生命
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f44';
    ctx.fillText(`${lives}×♥`, W - 10, 24);

    // 武器
    ctx.textAlign = 'left';
    ctx.font = '12px Courier New';
    const weaponLabels = { spread: 'S', rapid: 'R', spiral: 'K', lightning: 'T', homing: 'H' };
    let wx = 10;
    for (const wp of player.obtainedWeapons) {
        const label = weaponLabels[wp] || '?';
        if (wp === player.weapon) {
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 14px Courier New';
            ctx.fillText(label, wx, 44);
            wx += 18;
        } else {
            ctx.fillStyle = '#888';
            ctx.font = '12px Courier New';
            ctx.fillText(label, wx, 44);
            wx += 14;
        }
    }

    // 简单模式标识
    if (easyMode) {
        ctx.fillStyle = '#0ff';
        ctx.font = 'bold 12px Courier New';
        ctx.fillText('EASY MODE', 10, 62);
    }

    // Boss血条
    if (boss && boss.alive) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('BOSS', W/2, 60);
    }

    // 暂停提示
    if (state === 'paused') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('暂停', W/2, H/2);
    }

    // 胜利
    if (state === 'victory') {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff0';
        ctx.font = 'bold 48px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE!', W/2, H/2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Courier New';
        ctx.fillText(`得分: ${score}`, W/2, H/2 + 30);
    }
}

// ========== 主游戏循环 ==========
let lastTime = 0;
let animFrame = 0;

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (state !== 'playing' && state !== 'paused' && state !== 'victory') {
        // 绘制开始画面背景
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        return;
    }

    if (state === 'paused') {
        drawHUD();
        return;
    }

    // 更新
    if (state === 'playing') {
        frameCount++;
        // 移动平台更新
        for (const mp of movingPlatforms) {
            const prevX = mp.x;
            mp.x = mp.baseX + Math.sin(Date.now() * 0.001 * mp.speed) * mp.range;
            mp.dx = mp.x - prevX;

            // 平台与地形碰撞：检查平台四个角是否进入实心地形
            let blocked = false;
            const checkPoints = [
                {x: mp.x, y: mp.y},
                {x: mp.x + mp.w - 1, y: mp.y},
                {x: mp.x, y: mp.y + 11},
                {x: mp.x + mp.w - 1, y: mp.y + 11}
            ];
            for (const pt of checkPoints) {
                if (isSolid(getTile(pt.x, pt.y))) {
                    blocked = true;
                    break;
                }
            }
            if (blocked) {
                // 被地形挡住，回退并反转方向
                mp.x = prevX;
                mp.dx = 0;
                mp.speed = -mp.speed;
            }
        }
        updatePlayer();
        updateBullets();
        updateEnemies();
        updateDynamicSpawn();
        updateBoss();
        updateWaterBoss();
        updateEnemyBullets();
        updatePowerups();
        updateParticles();
        // 更新波纹
        for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.r += 0.8;
            r.alpha -= 0.015;
            if (r.alpha <= 0) ripples.splice(i, 1);
        }

        // 屏幕震动
        if (screenShake > 0) screenShake--;
    }

    if (state === 'victory') {
        updateParticles();
        victoryTimer--;
        if (victoryTimer <= 0) {
            if (multiplayerMode) {
                state = 'battleresult';
                if (!battleResult) {
                    document.getElementById('battleResultTitle').textContent = '等待对手...';
                    document.getElementById('battleResultTitle').style.color = '#0ff';
                    document.getElementById('battleResultDetails').innerHTML = '';
                    document.getElementById('battleResultScreen').style.display = 'flex';
                }
            } else {
                state = 'gameover';
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }
        }
    }

    // 绘制
    ctx.save();

    // 屏幕震动
    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake * 2,
            (Math.random() - 0.5) * screenShake * 2
        );
    }

    drawBackground(camera.x);
    drawLevel(camera.x);
    drawWaterBossShadow(camera.x);
    // 夜晚暗色滤镜（叠在场景上，角色不受影响）
    ctx.fillStyle = 'rgba(0,0,5,0.25)';
    ctx.fillRect(0, 0, W, H);
    drawPowerups(camera.x);
    drawEnemies(camera.x);
    drawBoss(camera.x);
    drawWaterBoss(camera.x);
    drawPlayer(camera.x);
    drawBullets(camera.x);
    drawParticles(camera.x);
    // 绘制水面波纹
    ripples.forEach(r => {
        const rx = r.x - camera.x;
        ctx.strokeStyle = `rgba(100,160,220,${r.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(rx, r.y, r.r, r.r * 0.35, 0, 0, Math.PI * 2);
        ctx.stroke();
        if (r.r > 8) {
            ctx.strokeStyle = `rgba(80,140,200,${r.alpha * 0.5})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(rx, r.y, r.r * 0.6, r.r * 0.2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
    });
    drawHUD();

    ctx.restore();
}

// ========== 游戏状态管理 ==========
document.addEventListener('keydown', e => {
    if (e.code === 'Enter') {
        if (state === 'start') {
            state = 'playing';
            initGame();
            document.getElementById('startScreen').style.display = 'none';
            startBGM();
        } else if (state === 'gameover') {
            state = 'playing';
            initGame();
            document.getElementById('gameOverScreen').style.display = 'none';
            startBGM();
        }
    }

    if (e.code === 'KeyP' && (state === 'playing' || state === 'paused')) {
        state = state === 'playing' ? 'paused' : 'playing';
        if (state === 'paused') stopBGM(); else startBGM();
    }
});

// ========== 模式选择按钮 ==========
document.getElementById('btnSingle').addEventListener('click', () => {
    state = 'playing';
    multiplayerMode = false;
    initGame();
    document.getElementById('startScreen').style.display = 'none';
    startBGM();
});

document.getElementById('btnBattle').addEventListener('click', () => {
    connectBattleServer();
});

// 启动
initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
